<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>غير متصل — MALIK</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #2563eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 1.25rem;
      font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.12), transparent 28%),
        var(--bg);
      color: var(--text);
    }
    .card {
      width: min(100%, 28rem);
      background: var(--card);
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 1.5rem;
      padding: 1.75rem;
      box-shadow: 0 18px 40px -28px rgba(15, 23, 42, 0.45);
      text-align: center;
    }
    .wordmark {
      margin: 0;
      font-family: 'Sora', ui-sans-serif, system-ui, sans-serif;
      font-weight: 800;
      font-size: 1.35rem;
      letter-spacing: 0.16em;
      color: var(--text);
      direction: ltr;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      margin: 0 auto 0.45rem;
    }
    .brand img { width: 2.5rem; height: 2.5rem; }
    .tagline {
      margin: 0 auto 1rem;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 700;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.35rem;
      font-weight: 900;
    }
    p {
      margin: 0 0 1.5rem;
      color: var(--muted);
      line-height: 1.7;
      font-size: 0.95rem;
      font-weight: 700;
    }
    button {
      min-height: 2.75rem;
      min-width: 8rem;
      border: 0;
      border-radius: 0.9rem;
      padding: 0.75rem 1.25rem;
      background: var(--primary);
      color: white;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    button:active { transform: scale(0.98); }
    .note {
      margin-top: 1rem;
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="card" role="status" aria-live="polite">
    <div class="brand">
      <img src="/malik-mark.svg" alt="" aria-hidden="true">
      <p class="wordmark">MALIK</p>
    </div>
    <p class="tagline">كل أملاكك في مكان واحد</p>
    <h1>أنت غير متصل حالياً</h1>
    <p>
      يمكن فتح غلاف التطبيق فقط دون اتصال. لن يتم عرض أو تخزين بيانات مالية حساسة في وضع عدم الاتصال.
    </p>
    <button type="button" onclick="window.location.reload()">إعادة المحاولة</button>
    <p class="note">MALIK · تجربة PWA آمنة</p>
  </main>
</body>
</html>
