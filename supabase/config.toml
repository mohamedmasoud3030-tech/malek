# Deterministic local/CI Supabase configuration.
# The database gate starts only PostgreSQL and excludes all non-database services.
project_id = "rentrix-ci"

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

# Scheduled worker uses a dedicated 32+ character invocation secret and performs
# its own constant-time check. No Production schedule is enabled by this config.
[functions.background-worker]
verify_jwt = false
