# Analyze executable application and Edge Function source. Forward-only SQL migrations
# are validated by empty-database replay, pgTAP/RLS tests, and migration evidence.
# Excluding immutable migration history, generated evidence, and pgTAP fixture SQL
# avoids parser/duplication noise without reducing database verification in CI.
sonar.sources=rentrix-app/src,supabase/functions
sonar.tests=rentrix-app/src,rentrix-app/e2e
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,.agents/**,docs/**,evidence/**,archive/recovery-reference/**,artifacts/rentrix-promo/**,supabase/migrations/**,supabase/migrations_consolidated/**,supabase/sql/**,supabase/tests/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/node_modules/**,evidence/**,archive/recovery-reference/**,artifacts/rentrix-promo/**
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,evidence/**,supabase/migrations/**,supabase/migrations_consolidated/**,supabase/sql/**,supabase/tests/**,archive/recovery-reference/**,artifacts/rentrix-promo/**
