name: Setup pinned Playwright

description: Restore the Chromium cache, install system dependencies, and verify the exact Playwright version.

inputs:
  playwright-version:
    description: Exact Playwright version expected by the lockfile.
    required: false
    default: '1.61.1'

runs:
  using: composite
  steps:
    - name: Restore Chromium cache
      id: playwright-cache
      uses: actions/cache@6849a6489940f00c2f30c0fb92c6274307ccb58a # v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ inputs.playwright-version }}-${{ hashFiles('pnpm-lock.yaml') }}

    - name: Install Chromium system dependencies
      shell: bash
      run: pnpm --filter ./rentrix-app exec playwright install-deps chromium

    - name: Install Chromium on cache miss
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm --filter ./rentrix-app exec playwright install chromium

    - name: Verify Playwright version
      shell: bash
      run: |
        actual="$(pnpm --filter ./rentrix-app exec playwright --version | tr -d '\r')"
        expected="Version ${{ inputs.playwright-version }}"
        if [[ "$actual" != "$expected" ]]; then
          echo "Expected $expected, got $actual" >&2
          exit 1
        fi
