name: Delete superseded maintenance branches once

on:
  push:
    paths:
      - '.github/workflows/delete-superseded-maintenance-branches-once.yml'

permissions:
  contents: write

jobs:
  delete-branches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Delete superseded Maintenance branches
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            fix/harvest-maintenance-1754 \
            ui/maintenance-register-polish-20260902
          do
            if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
              git push origin --delete "${branch}"
            else
              echo "Already absent: ${branch}"
            fi
          done
