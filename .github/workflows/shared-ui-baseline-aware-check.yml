name: Shared UI Baseline Aware Check

on:
  push:
    branches:
      - refactor/shared-ui-cleanup

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/shared-ui-cleanup
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Architecture guards
        run: pnpm --filter @workspace/rentrix run check:architecture
      - name: Typecheck changed surface against known baseline
        shell: bash
        run: |
          set +e
          pnpm --filter @workspace/rentrix run typecheck 2>&1 | tee /tmp/typecheck.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then exit 0; fi
          grep 'error TS' /tmp/typecheck.log | grep -v 'src/features/accounting/wp05Services.ts(107,46)' > /tmp/unexpected-errors.log || true
          if [ -s /tmp/unexpected-errors.log ]; then
            cat /tmp/unexpected-errors.log
            exit 1
          fi
          echo 'Only the known untouched wp05Services baseline type error remains.'
      - name: Remove one-shot workflow
        if: always()
        run: |
          rm -f .github/workflows/shared-ui-baseline-aware-check.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(ui): remove baseline-aware validation workflow"
            git push origin HEAD:refactor/shared-ui-cleanup
          fi
