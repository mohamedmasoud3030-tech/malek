name: Temporary Align Fake Backend 1708

on:
  push:
    branches:
      - fix/db-security-perf-0830

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/db-security-perf-0830
          fetch-depth: 0
      - name: Align hermetic RPC fixture and self-clean
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('rentrix-app/e2e/support/fake-supabase-backend.ts')
          s = p.read_text()
          old = '    wp05_rpt_cash_flow_gl: (args) => ({'
          new = '    rpt_cash_flow_gl: (args) => ({'
          if old not in s:
              raise SystemExit('expected legacy cash-flow fixture key not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-fake-backend-1708.yml
          git add rentrix-app/e2e/support/fake-supabase-backend.ts
          git diff --cached --check
          git commit -m "test(e2e): align canonical cash-flow RPC fixture"
          git push origin HEAD:fix/db-security-perf-0830
