name: Supabase AI Assistant Production Sync

on:
  workflow_run:
    workflows: ["CI / Typecheck, Lint & Build"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: supabase-ai-assistant-production-sync
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: deploy green main AI runtime
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    steps:
      - name: Checkout the exact green main SHA
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Verify the deployed source is still canonical main
        env:
          APPROVED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin main
          [[ "$(git rev-parse HEAD)" == "$APPROVED_SHA" ]]
          [[ "$(git rev-parse origin/main)" == "$APPROVED_SHA" ]]

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked toolchain
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Require production Supabase deployment credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"

      - name: Deploy canonical AI Assistant runtime
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          APPROVED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          echo "Deploying ai-assistant from main SHA $APPROVED_SHA"
          pnpm exec supabase functions deploy ai-assistant --project-ref "$SUPABASE_PROJECT_REF"

      - name: Verify function is listed after deployment
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          pnpm exec supabase functions list --project-ref "$SUPABASE_PROJECT_REF" | tee function-list.txt
          grep -F "ai-assistant" function-list.txt
