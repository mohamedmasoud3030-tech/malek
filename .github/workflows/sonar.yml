name: SonarCloud Analysis

on:
  push:
    branches: [main, 'arena/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      token_override:
        description: 'Optional SonarCloud token; falls back to the SONAR_TOKEN secret when empty.'
        required: false
        default: ''

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sonarcloud:
    name: sonarcloud
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Resolve SONAR_TOKEN
        env:
          SECRET_TOKEN: ${{ secrets.SONAR_TOKEN }}
          OVERRIDE_TOKEN: ${{ github.event.inputs.token_override }}
        run: |
          set -u
          TOKEN="${OVERRIDE_TOKEN:-${SECRET_TOKEN}}"
          if [ -z "${TOKEN}" ]; then
            echo "::error::No SonarCloud token available (secret SONAR_TOKEN empty, no override given)."
            exit 1
          fi
          # Never let the token appear in logs.
          printf '::add-mask::%s\n' "${TOKEN}"
          echo "SONAR_TOKEN_EFFECTIVE=${TOKEN}" >> "${GITHUB_ENV}"
          echo "SONAR_TOKEN is configured (source: $([ -n "${OVERRIDE_TOKEN}" ] && echo override || echo secret))."
      - name: Diagnose SONAR_TOKEN against SonarCloud
        run: |
          SONAR_TOKEN="${SONAR_TOKEN_EFFECTIVE}" 
          set -uo pipefail
          probe() {
            local label="$1"; shift
            local out
            out="$(curl -s -w '|HTTP:%{http_code}' -u "${SONAR_TOKEN}:" "$@" || true)"
            local status="${out##*|HTTP:}"
            local body="${out%|HTTP:*}"
            local msg="probe ${label} => HTTP ${status} :: $(printf '%s' "${body}" | head -c 300)"
            echo "${msg}"
            printf '::notice title=sonar-token-probe::%s\n' "${msg}"
          }
          probe projects-search 'https://sonarcloud.io/api/projects/search?organization=mohamedmasoud3030-tech&ps=5'
          probe analysis-jres 'https://api.sonarcloud.io/analysis/jres?os=linux&arch=x86_64'
          probe component-show 'https://sonarcloud.io/api/components/show?component=mohamedmasoud3030-tech_rentrixxx'
      - name: Install sonar-scanner-cli
        run: |
          set -euo pipefail
          SCANNER_VERSION="8.1.0.6389"
          curl -sSLo /tmp/sonar-scanner.zip \
            "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-${SCANNER_VERSION}-linux-x64.zip"
          unzip -q /tmp/sonar-scanner.zip -d /opt
          mv "/opt/sonar-scanner-${SCANNER_VERSION}-linux-x64" /opt/sonar-scanner
          echo "/opt/sonar-scanner/bin" >> "${GITHUB_PATH}"
      - name: SonarCloud scan
        run: |
          SONAR_TOKEN="${SONAR_TOKEN_EFFECTIVE}" 
          set -uo pipefail
          ARGS=(
            "-Dsonar.token=${SONAR_TOKEN}"
            "-Dsonar.host.url=https://sonarcloud.io"
            "-Dsonar.projectKey=mohamedmasoud3030-tech_rentrixxx"
            "-Dsonar.organization=mohamedmasoud3030-tech"
            "-Dsonar.scanner.skipJreProvisioning=true"
          )
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            # Analyze the PR head as its own branch; PR decoration is not
            # required for the remediation loop and avoids merge-ref churn.
            BRANCH="$(jq -r '.pull_request.head.ref' "${GITHUB_EVENT_PATH}")"
          else
            BRANCH="${GITHUB_REF_NAME}"
          fi
          if [ "${BRANCH}" != "main" ]; then
            ARGS+=("-Dsonar.branch.name=${BRANCH}")
          fi
          set +e
          sonar-scanner "${ARGS[@]}" 2>&1 | tee /tmp/sonar-scan.log
          ec="${PIPESTATUS[0]}"
          set -e
          if [ "${ec}" -ne 0 ]; then
            # Artifact storage quota is exhausted on this repository, so surface
            # the scanner failure through check-run annotations instead.
            tail -n 80 /tmp/sonar-scan.log | while IFS= read -r line; do
              printf '::error title=sonar-scanner::%s\n' "${line}"
            done
          fi
          exit "${ec}"
