name: SonarCloud Analysis

on:
  push:
    branches: [main, 'arena/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sonar-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sonarcloud:
    name: sonarcloud
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Verify SONAR_TOKEN is available
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "::error::SONAR_TOKEN secret is not configured for this repository."
            exit 1
          fi
          echo "SONAR_TOKEN is configured."
      - name: Validate SONAR_TOKEN against SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -uo pipefail
          validate="$(curl -s -u "${SONAR_TOKEN}:" https://sonarcloud.io/api/authentication/validate)"
          echo "authentication/validate => ${validate}"
          projects="$(curl -s -u "${SONAR_TOKEN}:" 'https://sonarcloud.io/api/projects/search?organization=mohamedmasoud3030-tech&ps=5')"
          echo "projects/search => ${projects}" | head -c 800; echo
          if ! printf '%s' "${validate}" | grep -q '"valid":true'; then
            echo "::error::SONAR_TOKEN was rejected by SonarCloud (expired, revoked or wrong organization)."
            exit 1
          fi
      - name: Install sonar-scanner-cli
        run: |
          set -euo pipefail
          SCANNER_VERSION="8.1.0.6389"
          curl -sSLo /tmp/sonar-scanner.zip \
            "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-${SCANNER_VERSION}-linux-x64.zip"
          unzip -q /tmp/sonar-scanner.zip -d /opt
          mv "/opt/sonar-scanner-${SCANNER_VERSION}-linux-x64" /opt/sonar-scanner
          echo "/opt/sonar-scanner/bin" >> "${GITHUB_PATH}"
      - name: SonarCloud scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -uo pipefail
          ARGS=(
            "-Dsonar.token=${SONAR_TOKEN}"
            "-Dsonar.host.url=https://sonarcloud.io"
            "-Dsonar.projectKey=mohamedmasoud3030-tech_rentrixxx"
            "-Dsonar.organization=mohamedmasoud3030-tech"
            "-Dsonar.scanner.skipJreProvisioning=true"
          )
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            # Analyze the PR head as its own branch; PR decoration is not
            # required for the remediation loop and avoids merge-ref churn.
            BRANCH="$(jq -r '.pull_request.head.ref' "${GITHUB_EVENT_PATH}")"
          else
            BRANCH="${GITHUB_REF_NAME}"
          fi
          if [ "${BRANCH}" != "main" ]; then
            ARGS+=("-Dsonar.branch.name=${BRANCH}")
          fi
          set +e
          sonar-scanner "${ARGS[@]}" 2>&1 | tee /tmp/sonar-scan.log
          ec="${PIPESTATUS[0]}"
          set -e
          if [ "${ec}" -ne 0 ]; then
            # Artifact storage quota is exhausted on this repository, so surface
            # the scanner failure through check-run annotations instead.
            tail -n 80 /tmp/sonar-scan.log | while IFS= read -r line; do
              printf '::error title=sonar-scanner::%s\n' "${line}"
            done
          fi
          exit "${ec}"
