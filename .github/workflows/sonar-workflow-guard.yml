name: Sonar Workflow Security Guard

# Phase 6 (security) regression gate: proves the SonarCloud workflow never takes a
# credential from PR/issue text. Static checks only, so it is safe to run on PR
# branches; run it locally (without --static-only) for the dynamic replay.
on:
  pull_request:
    paths:
      - '.github/workflows/sonar.yml'
      - '.github/workflows/sonar-workflow-guard.yml'
      - 'scripts/security/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sonar.yml'
      - '.github/workflows/sonar-workflow-guard.yml'
      - 'scripts/security/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: verify-sonar-token-source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml
      - name: Verify credential source in sonar.yml
        run: bash scripts/security/verify-sonar-token-source.sh .github/workflows/sonar.yml --static-only
      - name: Fail if a credential-shaped string was committed
        run: |
          set -euo pipefail
          if grep -rInE 'SONAR_CREDENTIAL_MARKER[[:space:]]+v1:[[:space:]]*[A-Za-z0-9]{8,}' \
               --exclude-dir=.git .github scripts 2>/dev/null; then
            echo "::error::A credential marker was found in tracked sources."
            exit 1
          fi
          echo "No credential markers in tracked sources."
