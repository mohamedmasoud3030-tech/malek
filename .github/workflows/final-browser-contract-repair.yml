name: Final Browser Contract Repair

on:
  push:
    branches:
      - release/final-browser-contract-20260828

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 1
      - name: Align contract acceptance with canonical detail header
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('rentrix-app/e2e/document-platform-acceptance.spec.ts'): [
                  (
                      "const trigger = page.getByRole('button', { name: 'إجراءات أخرى', exact: true });",
                      "const trigger = page.getByRole('button', { name: 'إجراءات العقد', exact: true });",
                  ),
                  (
                      "await expect(page.getByRole('heading', { name: 'تفاصيل العقد', exact: true })).toBeVisible({ timeout: 20_000 });",
                      "await expect(page.getByRole('button', { name: 'إجراءات العقد', exact: true })).toBeVisible({ timeout: 20_000 });",
                  ),
              ],
              Path('rentrix-app/e2e/wp06-document-output.spec.ts'): [
                  (
                      "await expect(page.getByRole('heading', { name: 'تفاصيل العقد', exact: true })).toBeVisible({ timeout: 30_000 });",
                      "await expect(page.getByRole('button', { name: 'إجراءات العقد', exact: true })).toBeVisible({ timeout: 30_000 });",
                  ),
                  (
                      "await page.getByRole('button', { name: 'إجراءات أخرى', exact: true }).click();",
                      "await page.getByRole('button', { name: 'إجراءات العقد', exact: true }).click();",
                  ),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one occurrence, found {count}: {old}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY
          git rm .github/workflows/final-browser-contract-repair.yml
          git diff --check
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rentrix-app/e2e/document-platform-acceptance.spec.ts rentrix-app/e2e/wp06-document-output.spec.ts
          git commit -m "test(release): align contract action acceptance"
          git push origin HEAD:release/final-browser-contract-20260828
