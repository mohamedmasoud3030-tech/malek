name: One-time CI Tool Pin Bootstrap

on:
  push:
    branches: [feat/p0-real-implementation]
    paths:
      - .github/workflows/ci-tool-pin-bootstrap.yml

permissions:
  contents: write

jobs:
  pin-tools-and-remove-bootstrap:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: feat/p0-real-implementation
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Pin manifests and lockfile without updating dependencies
        run: node scripts/ci/pin-tool-versions.mjs
      - name: Prove frozen installation and exact versions
        run: |
          pnpm install --frozen-lockfile
          node scripts/ci/verify-tool-versions.mjs
      - name: Remove bootstrap and commit the deterministic pins
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ci-tool-pin-bootstrap.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json rentrix-app/package.json pnpm-lock.yaml .github/workflows/ci-tool-pin-bootstrap.yml
          git commit -m "ci: pin Supabase and Playwright exactly"
          git push origin HEAD:feat/p0-real-implementation
