name: Apply CI hardening patch

on:
  push:
    branches:
      - fix/ci-hardening-sonar-supabase-diagnostics

permissions:
  contents: write

jobs:
  apply-patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: fix/ci-hardening-sonar-supabase-diagnostics
          fetch-depth: 0
      - name: Apply exact uploaded commit patch
        env:
          PATCH_GZIP_B64: 
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, os
          data = gzip.decompress(base64.b64decode(os.environ["PATCH_GZIP_B64"]))
          open("/tmp/ci-hardening.patch", "wb").write(data)
          PY
          test "$(sha256sum /tmp/ci-hardening.patch | cut -d' ' -f1)" = "8f47590ff7420253a5e0cffc1e136ff2b50c6f8d02bf45e16c3d1cff3a5f1c1c"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git apply --check /tmp/ci-hardening.patch
          git am /tmp/ci-hardening.patch
          git rm .github/workflows/apply-ci-hardening-patch.yml
          git commit --amend --no-edit
          git push origin HEAD:fix/ci-hardening-sonar-supabase-diagnostics
