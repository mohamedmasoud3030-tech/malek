name: Deep UI Delete Batch One
on:
  push:
    branches: [refactor/shared-ui-deep-clean-work]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/shared-ui-deep-clean-work
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Remove dead shared surfaces and update contracts
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('rentrix-app/src')
          ui = root / 'components/ui'

          dead = [
            root / 'components/loading-screen.tsx',
            ui / 'next-step-actions.tsx',
            ui / 'operational-summary.tsx',
            ui / 'date-picker.tsx',
            ui / 'dropdown.tsx',
            ui / 'file-picker-field.tsx',
            ui / 'icon-button.tsx',
            ui / 'mobile-card.tsx',
            ui / 'spinner.tsx',
            ui / 'text-field.tsx',
            ui / 'typography.tsx',
            ui / 'view-mode-toggle.tsx',
            ui / 'workspace-nav.tsx',
          ]
          for path in dead:
            if not path.exists():
              raise SystemExit(f'missing deletion candidate: {path}')
            path.unlink()

          index = ui / 'index.ts'
          s = index.read_text()
          remove_lines = [
            'export { IconButton } from "./icon-button";\n',
            'export { TextField, TextAreaField, PasswordField, FieldShell, type TextFieldProps, type TextAreaFieldProps } from "./text-field";\n',
            'export { Spinner, type SpinnerProps } from "./spinner";\n',
            'export { Typography, type TypographyVariant } from "./typography";\n',
            'export { WorkspaceNav, type WorkspaceNavItem } from "./workspace-nav";\n',
            'export { FilePickerField } from "./file-picker-field";\n',
            'export { ViewModeToggle, type ViewMode, type ViewModeToggleProps } from "./view-mode-toggle";\n',
            'export { MobileCard } from "./mobile-card";\n',
            'export { DatePicker } from "./date-picker";\n',
            'export { Dropdown, type DropdownOption } from "./dropdown";\n',
          ]
          for line in remove_lines:
            if line not in s:
              raise SystemExit(f'expected barrel export missing: {line.strip()}')
            s = s.replace(line, '')
          index.write_text(s)

          fixture = root / 'features/browser-ux/state-surfaces.e2e-fixture.tsx'
          s = fixture.read_text()
          s = s.replace("import { LoadingScreen } from '@/components/loading-screen';", "import { LoadingState } from '@/components/ui/loading-state';")
          s = s.replace('<LoadingScreen rows={3} />', '<LoadingState variant="table" rows={3} label="جارٍ تحميل السجلات" />')
          fixture.write_text(s)

          (ui / 'design-system-exports.test.ts').write_text('''import { describe, expect, it } from 'vitest';
import * as ui from './index';

const REACT_COMPONENT_MARKERS: readonly symbol[] = [
  Symbol.for('react.forward_ref'),
  Symbol.for('react.memo'),
];

function isReactComponent(value: unknown): boolean {
  if (typeof value === 'function') return true;
  if (typeof value !== 'object' || value === null || !('$$typeof' in value)) return false;
  return REACT_COMPONENT_MARKERS.includes((value as { $$typeof: symbol }).$$typeof);
}

describe('shared design system barrel', () => {
  it('exports the canonical product UX primitives', () => {
    const required = [
      'Button', 'Card', 'Badge', 'StatusBadge', 'DataTable', 'EntityTable', 'EntityCard',
      'SearchInput', 'FilterBar', 'Dialog', 'BottomSheet', 'ConfirmDialog', 'EmptyState',
      'LoadingState', 'ErrorState', 'ActionMenu', 'FormField', 'KpiCard', 'SectionHeader',
      'ResponsiveCardGrid',
    ] as const;

    for (const name of required) {
      expect(isReactComponent(ui[name]), `${name} should be exported from components/ui`).toBe(true);
    }
  });

  it('does not expose retired duplicate primitives', () => {
    for (const name of [
      'Modal', 'Drawer', 'InlineStatCard', 'StatCard', 'MobileCard', 'ViewModeToggle',
      'Dropdown', 'IconButton', 'DatePicker', 'FilePickerField', 'Spinner', 'TextField',
      'TextAreaField', 'PasswordField', 'Typography', 'WorkspaceNav',
    ]) {
      expect(name in ui, `${name} should not be part of the public UI surface`).toBe(false);
    }
  });
});
''')

          (ui / 'form-association.a11y.test.tsx').write_text('''// @vitest-environment happy-dom
import { afterEach, describe, expect, it } from 'vitest';
import { cleanup, render, screen } from '@testing-library/react';
import { EntityForm } from './entity-form';
import { FormField } from './form-field';
import { Input } from './input';
import { Select } from './select';
import { Textarea } from './textarea';

afterEach(cleanup);

function describedText(control: Element): string[] {
  const ids = control.getAttribute('aria-describedby')?.split(/\\s+/).filter(Boolean) ?? [];
  return ids.map((id) => document.getElementById(id)?.textContent ?? '');
}

describe('EntityForm.Field — name/description separation', () => {
  it('keeps the label as the accessible name and supporting copy as description', () => {
    render(<EntityForm.Field label="رقم العقد" description="يجب أن يكون فريدًا." error="رقم العقد مطلوب"><Input /></EntityForm.Field>);
    const control = screen.getByLabelText('رقم العقد');
    expect(describedText(control)).toEqual(expect.arrayContaining(['يجب أن يكون فريدًا.', 'رقم العقد مطلوب']));
    expect(control.getAttribute('aria-invalid')).toBe('true');
  });

  it('keeps select and textarea children associated', () => {
    render(<><EntityForm.Field label="الحالة"><Select><option>نشط</option></Select></EntityForm.Field><EntityForm.Field label="ملاحظات"><Textarea /></EntityForm.Field></>);
    expect(screen.getByLabelText('الحالة').tagName).toBe('SELECT');
    expect(screen.getByLabelText('ملاحظات').tagName).toBe('TEXTAREA');
  });

  it('leaves plain fields free of dangling descriptions', () => {
    render(<EntityForm.Field label="الهاتف"><Input /></EntityForm.Field>);
    expect(screen.getByLabelText('الهاتف').getAttribute('aria-describedby')).toBeNull();
  });
});

describe('FormField — description reaches the control', () => {
  it('binds errors and required state to the control', () => {
    render(<FormField label="اسم العقار" htmlFor="property-name" required error="هذا الحقل مطلوب"><Input id="property-name" /></FormField>);
    const control = screen.getByLabelText(/اسم العقار/);
    expect(describedText(control)).toContain('هذا الحقل مطلوب');
    expect(control.getAttribute('aria-invalid')).toBe('true');
    expect(control.getAttribute('aria-required')).toBe('true');
  });

  it('binds hints and labels without requiring htmlFor at every call site', () => {
    const { rerender } = render(<FormField label="الاسم" htmlFor="trade-name" hint="الاسم التجاري"><Input id="trade-name" /></FormField>);
    expect(describedText(screen.getByLabelText('الاسم'))).toContain('الاسم التجاري');
    rerender(<FormField label="القناة"><Select><option>واتساب</option></Select></FormField>);
    expect(screen.getByLabelText('القناة').tagName).toBe('SELECT');
  });
});
''')

          (ui / 'primitives.axe.test.tsx').write_text('''// @vitest-environment happy-dom
import { afterEach, describe, expect, it } from 'vitest';
import { cleanup, render } from '@testing-library/react';
import type { ReactElement } from 'react';
import axe from 'axe-core';
import { Home } from 'lucide-react';
import { Alert, AlertDescription, AlertTitle } from './alert';
import { Badge } from './badge';
import { Button } from './button';
import { Card, CardContent, CardHeader, CardTitle } from './card';
import { EntityCard } from './entity-card';
import { EntityForm } from './entity-form';
import { ErrorState } from './error-state';
import { FilterTabs } from './filter-tabs';
import { FormField } from './form-field';
import { Input } from './input';
import { KpiCard } from './kpi-card';
import { LoadingState } from './loading-state';
import { SearchInput } from './search-input';
import { SectionTabPanel, SectionTabs } from './section-tabs';
import { Select } from './select';
import { EmptyState, NoPermissionState, OfflineState } from './state-surfaces';
import { StatusBadge } from './status-badge';
import { Table, TableBody, TableCell, TableHead, TableHeader, TableRow } from './table';
import { Textarea } from './textarea';

afterEach(cleanup);
const LAYOUT_DEPENDENT_RULES = ['color-contrast', 'target-size'] as const;

async function expectNoViolations(ui: ReactElement) {
  const { container } = render(ui);
  const results = await axe.run(container, {
    runOnly: { type: 'tag', values: ['wcag2a', 'wcag2aa', 'wcag21a', 'wcag21aa'] },
    rules: Object.fromEntries(LAYOUT_DEPENDENT_RULES.map((id) => [id, { enabled: false }])),
  });
  const report = results.violations.map((violation) => `${violation.id}: ${violation.help}`).join('\\n');
  expect(report, `axe violations:\\n${report}`).toBe('');
}

const cases: ReadonlyArray<readonly [string, ReactElement]> = [
  ['Button states', <div><Button>حفظ</Button><Button loading>حفظ</Button><Button disabled>حفظ</Button><Button variant="danger">حذف</Button></div>],
  ['SearchInput', <SearchInput value="بحث" onChange={() => {}} />],
  ['FilterTabs', <FilterTabs options={[{ value: 'all', label: 'الكل', count: 3 }, { value: 'active', label: 'نشط' }]} value="all" onChange={() => {}} />],
  ['SectionTabs', <><SectionTabs items={[{ id: 'a', label: 'نظرة عامة', icon: Home }]} activeId="a" onChange={() => {}} ariaLabel="أقسام" /><SectionTabPanel id="a" activeId="a">المحتوى</SectionTabPanel></>],
  ['EntityForm', <EntityForm.Root><EntityForm.Section title="بيانات"><EntityForm.Field label="رقم العقد" description="فريد" error="مطلوب"><Input /></EntityForm.Field><EntityForm.Field label="الحالة"><Select><option>نشط</option></Select></EntityForm.Field><EntityForm.Field label="ملاحظات"><Textarea /></EntityForm.Field></EntityForm.Section><EntityForm.Actions submitLabel="حفظ" onCancel={() => {}} /></EntityForm.Root>],
  ['FormField', <FormField label="اسم العقار" htmlFor="pf-1" required error="مطلوب"><Input id="pf-1" /></FormField>],
  ['State surfaces', <div><EmptyState title="لا توجد بيانات" /><OfflineState title="غير متصل" /><NoPermissionState title="لا صلاحية" /><ErrorState title="خطأ" /><LoadingState /></div>],
  ['KpiCard', <KpiCard label="الإيراد" value="1,234.500 OMR" icon={Home} />],
  ['Badges', <div><Badge>نشط</Badge><StatusBadge tone="success">نشط</StatusBadge></div>],
  ['Alert', <Alert><AlertTitle>تنبيه</AlertTitle><AlertDescription>وصف</AlertDescription></Alert>],
  ['Card', <Card><CardHeader><CardTitle>عنوان</CardTitle></CardHeader><CardContent>محتوى</CardContent></Card>],
  ['EntityCard', <EntityCard id="p-1" name="برج الواحة" type="property" onClick={() => undefined} actions={[{ label: 'تعديل', icon: Home, onClick: () => undefined, ariaLabel: 'تعديل السجل' }]} />],
  ['Table', <Table aria-label="سجل"><TableHeader><TableRow><TableHead>الاسم</TableHead></TableRow></TableHeader><TableBody><TableRow><TableCell>سجل ١</TableCell></TableRow></TableBody></Table>],
];

describe('axe — active shared primitives', () => {
  for (const [name, ui] of cases) it(name, async () => expectNoViolations(ui));
});

describe('axe — ARIA relationships resolve', () => {
  it('keeps described ids mounted', () => {
    const { container } = render(<EntityForm.Field label="المبلغ" description="بالريال" error="غير صالح"><Input /></EntityForm.Field>);
    for (const element of Array.from(container.querySelectorAll('[aria-describedby]'))) {
      for (const id of element.getAttribute('aria-describedby')?.split(/\\s+/).filter(Boolean) ?? []) {
        expect(container.querySelector(`#${CSS.escape(id)}`)).not.toBeNull();
      }
    }
  });
});

describe('axe — entity cards avoid nested interactive controls', () => {
  it('keeps primary activation and row actions as siblings', () => {
    const { container } = render(<EntityCard id="p-1" name="برج الواحة" type="property" onClick={() => undefined} actions={[{ label: 'تعديل', icon: Home, onClick: () => undefined, ariaLabel: 'تعديل السجل' }]} />);
    const controls = Array.from(container.querySelectorAll('button, a[href], [role="button"]'));
    expect(controls).toHaveLength(2);
    for (const control of controls) expect(control.querySelector('button, a[href], [role="button"]')).toBeNull();
  });
});
''')

          # No production or test file may retain a direct import of deleted modules.
          needles = [p.stem for p in dead]
          offenders = []
          for path in root.rglob('*'):
            if not path.is_file() or path.suffix not in {'.ts', '.tsx'}: continue
            text = path.read_text(errors='ignore')
            for needle in needles:
              if f'/{needle}' in text or f'./{needle}' in text:
                offenders.append(f'{path}: {needle}')
          if offenders:
            raise SystemExit('deleted-module references remain:\n' + '\n'.join(offenders))
          PY
          rm -f .github/workflows/deep-ui-delete-batch-one.yml
      - name: Targeted component contracts
        run: pnpm --filter @workspace/rentrix exec vitest run --config vite.config.ts src/components/ui/design-system-exports.test.ts src/components/ui/form-association.a11y.test.tsx src/components/ui/primitives.axe.test.tsx
