name: Supabase Production Migrations (manual, approval-gated)

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact 40-character main SHA reviewed for this run
        required: true
        type: string
      action:
        description: local-preflight never accesses Production; production-inspect is read-only; deploy applies after approval
        required: true
        default: local-preflight
        type: choice
        options: [local-preflight, production-inspect, deploy]
      inspection_run_id:
        description: Successful production-inspect workflow run ID required for deploy
        required: false
        type: string
      backup_reference:
        description: Owner-created backup reference (time, project, recovery method, verifier) required for deploy
        required: false
        type: string
      rollback_plan_reference:
        description: Reviewed rollback or mitigation plan reference required for deploy
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: production-migrations
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  local-preflight:
    name: local preflight / no Production access
    if: ${{ inputs.action == 'local-preflight' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: { fetch-depth: 0, ref: main }
      - name: Verify reviewed main SHA
        env: { APPROVED_SHA: ${{ inputs.approved_sha }} }
        run: |
          set -euo pipefail
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin main
          [[ "$(git rev-parse HEAD)" == "$APPROVED_SHA" ]]
          [[ "$(git rev-parse origin/main)" == "$APPROVED_SHA" ]]
          git merge-base --is-ancestor "$APPROVED_SHA" origin/main
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build local migration evidence
        run: |
          set -euo pipefail
          mkdir -p migration-evidence
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort | tee migration-evidence/local-migration-manifest.txt
          versions=$(cut -d_ -f1 migration-evidence/local-migration-manifest.txt)
          test -z "$(printf '%s\n' "$versions" | sort | uniq -d)"
          sha256sum supabase/migrations/*.sql > migration-evidence/local-migration-sha256.txt
          pnpm exec supabase migration list --local | tee migration-evidence/local-migration-status.txt
          printf 'action=local-preflight\napproved_sha=%s\nrun_id=%s\ntimestamp=%s\n' "$APPROVED_SHA" "$GITHUB_RUN_ID" "$(date -u +%FT%TZ)" > migration-evidence/summary.txt
        env: { APPROVED_SHA: ${{ inputs.approved_sha }} }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: production-local-preflight-${{ github.run_id }}, path: migration-evidence, retention-days: 30 }

  production-inspect:
    name: production inspect / read-only
    if: ${{ inputs.action == 'production-inspect' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: { name: production }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: { fetch-depth: 0, ref: main }
      - name: Verify reviewed main SHA
        env: { APPROVED_SHA: ${{ inputs.approved_sha }} }
        run: |
          set -euo pipefail
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin main
          [[ "$(git rev-parse HEAD)" == "$APPROVED_SHA" ]]
          [[ "$(git rev-parse origin/main)" == "$APPROVED_SHA" ]]
          git merge-base --is-ancestor "$APPROVED_SHA" origin/main
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Inspect Production migration state without writes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" && test -n "$SUPABASE_PROJECT_REF" && test -n "$SUPABASE_DB_PASSWORD"
          mkdir -p migration-evidence
          pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          pnpm exec supabase migration list --linked --password "$SUPABASE_DB_PASSWORD" | tee migration-evidence/remote-migration-status.txt
          pnpm exec supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --dry-run | tee migration-evidence/production-dry-run.txt
          grep -E '^[[:space:]]*[0-9]{14}' migration-evidence/production-dry-run.txt > migration-evidence/missing-migrations.txt || true
          printf 'action=production-inspect\napproved_sha=%s\nrun_id=%s\ntimestamp=%s\n' "$APPROVED_SHA" "$GITHUB_RUN_ID" "$(date -u +%FT%TZ)" > migration-evidence/summary.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: production-inspect-${{ github.run_id }}, path: migration-evidence, retention-days: 90 }

  deploy:
    name: approved production migration deploy
    if: ${{ inputs.action == 'deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: { name: production }
    steps:
      - name: Require inspection and recovery evidence
        env:
          INSPECTION_RUN_ID: ${{ inputs.inspection_run_id }}
          BACKUP_REFERENCE: ${{ inputs.backup_reference }}
          ROLLBACK_PLAN_REFERENCE: ${{ inputs.rollback_plan_reference }}
        run: |
          set -euo pipefail
          test -n "$INSPECTION_RUN_ID" && test -n "$BACKUP_REFERENCE" && test -n "$ROLLBACK_PLAN_REFERENCE"
          [[ "$INSPECTION_RUN_ID" =~ ^[0-9]+$ ]]
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: { fetch-depth: 0, ref: main }
      - name: Download successful production inspection evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: production-inspect-${{ inputs.inspection_run_id }}
          path: inspection-evidence
          run-id: ${{ inputs.inspection_run_id }}
          github-token: ${{ github.token }}
      - name: Verify inspection evidence and current main SHA
        env: { APPROVED_SHA: ${{ inputs.approved_sha }} }
        run: |
          set -euo pipefail
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          grep -Fx 'action=production-inspect' inspection-evidence/summary.txt
          grep -Fx "approved_sha=$APPROVED_SHA" inspection-evidence/summary.txt
          git fetch --no-tags origin main
          [[ "$(git rev-parse HEAD)" == "$APPROVED_SHA" ]]
          [[ "$(git rev-parse origin/main)" == "$APPROVED_SHA" ]]
          git merge-base --is-ancestor "$APPROVED_SHA" origin/main
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Re-inspect Production and reject changed migration plan
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          pnpm exec supabase migration list --linked --password "$SUPABASE_DB_PASSWORD" | tee current-remote-migration-status.txt
          pnpm exec supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --dry-run | tee current-production-dry-run.txt
          diff -u inspection-evidence/remote-migration-status.txt current-remote-migration-status.txt
          diff -u inspection-evidence/production-dry-run.txt current-production-dry-run.txt
      - name: Re-verify exact SHA immediately before apply
        env: { APPROVED_SHA: ${{ inputs.approved_sha }} }
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          [[ "$(git rev-parse HEAD)" == "$APPROVED_SHA" && "$(git rev-parse origin/main)" == "$APPROVED_SHA" ]]
      - name: Apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: pnpm exec supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --yes | tee deploy-output.txt
      - name: Upload deployment evidence
        if: always()
        run: |
          mkdir -p migration-evidence
          cp deploy-output.txt migration-evidence/ 2>/dev/null || true
          printf 'approved_sha=%s\ninspection_run_id=%s\nbackup_reference=%s\nrollback_plan_reference=%s\nrun_id=%s\ntimestamp=%s\n' "${{ inputs.approved_sha }}" "${{ inputs.inspection_run_id }}" "${{ inputs.backup_reference }}" "${{ inputs.rollback_plan_reference }}" "$GITHUB_RUN_ID" "$(date -u +%FT%TZ)" > migration-evidence/deployment-summary.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: { name: production-migration-deployment-${{ github.run_id }}, path: migration-evidence, retention-days: 90 }
