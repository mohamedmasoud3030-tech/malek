name: Apply exact uploaded patch

on:
  push:
    branches:
      - apply/finance-settings-dedup-patch-final
    paths:
      - '.github/workflows/apply-exact-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact uploaded patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < .github/uploaded.patch)" -eq 66448
          echo "32e24e5a1412b4e6eed35b5034c3e5468e8c55cbe08aded1405224ebe82adc5d  .github/uploaded.patch" | sha256sum -c -
          git apply --check .github/uploaded.patch

      - name: Apply and validate patch
        shell: bash
        run: |
          set -euo pipefail
          git apply .github/uploaded.patch
          test "$(git diff --name-only | wc -l)" -eq 20
          git diff --check

      - name: Commit only product changes
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/uploaded.patch .github/workflows/apply-exact-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(finance,settings): apply workspace dedup patch"
          git push origin HEAD:"$GITHUB_REF_NAME"

