name: Vendor Anthropic Skills

on:
  push:
    branches:
      - chore/vendor-anthropic-skills
    paths:
      - .github/workflows/vendor-anthropic-skills.yml

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MALEK
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone Anthropic skills at pinned commit
        run: |
          git clone https://github.com/anthropics/skills.git /tmp/anthropic-skills
          git -C /tmp/anthropic-skills checkout 53048666b05b4799081517d00e09e0a2dd688678

      - name: Copy skills folder unchanged
        run: |
          rm -rf skills
          cp -a /tmp/anthropic-skills/skills ./skills
          diff -qr /tmp/anthropic-skills/skills ./skills

      - name: Commit vendored skills
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all skills
          if git diff --cached --quiet; then
            echo "Skills already match pinned Anthropic source."
            exit 0
          fi
          git commit -m "chore(skills): vendor Anthropic skills unchanged"
          git push origin HEAD:${GITHUB_REF_NAME}
