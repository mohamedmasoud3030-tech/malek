name: Canonical Database Baseline

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'scripts/canonical-db/**'
      - 'scripts/db0/**'
      - 'rentrix-app/src/types/database.ts'
      - '.github/workflows/canonical-db-baseline.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'scripts/canonical-db/**'
      - 'scripts/db0/**'
      - 'rentrix-app/src/types/database.ts'
      - '.github/workflows/canonical-db-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-db-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PLAYWRIGHT_VERSION: '1.61.1'

jobs:
  canonical-baseline:
    name: canonical-baseline-real-supabase
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install deterministic dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild approved native toolchain dependency
        run: pnpm rebuild esbuild

      - name: Verify pinned toolchain
        run: node scripts/ci/verify-tool-versions.mjs

      - name: Restore Chromium binary cache
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium binary on cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter ./rentrix-app exec playwright install chromium

      - name: Verify Chromium installation
        run: pnpm --filter ./rentrix-app exec playwright install --dry-run chromium

      - name: Build and prove canonical database foundation
        run: bash scripts/canonical-db/build-baseline.sh

      - name: Regenerate canonical TypeScript database contract
        run: pnpm db0:gen-types

      - name: Reject generated schema or type drift
        run: git diff --exit-code -- supabase rentrix-app/src/types/database.ts

      - name: Upload canonical build evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: canonical-db-baseline-${{ github.run_id }}
          path: .canonical-db-output
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
