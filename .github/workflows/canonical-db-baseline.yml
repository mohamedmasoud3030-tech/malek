name: Canonical Database Baseline

on:
  push:
    branches:
      - agent/canonical-db-baseline-takeover
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canonical-db-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  canonical-baseline:
    name: canonical-baseline-real-supabase
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: agent/canonical-db-baseline-takeover

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install deterministic dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild approved native toolchain dependency
        run: pnpm rebuild esbuild

      - name: Verify pinned toolchain
        run: node scripts/ci/verify-tool-versions.mjs

      - name: Build and prove canonical database foundation
        run: bash scripts/canonical-db/build-baseline.sh

      - name: Reject UI/frontend implementation changes in this database branch
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          changed="$(git diff --name-only origin/main...HEAD -- rentrix-app/src rentrix-app/e2e rentrix-app/public || true)"
          if [[ -n "$changed" ]]; then
            echo "Database baseline branch modified frontend/UI paths:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi

      - name: Upload canonical build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: canonical-db-baseline-${{ github.run_id }}
          path: .canonical-db-output
          if-no-files-found: warn
          retention-days: 30

      - name: Commit generated canonical bootstrap after all proofs pass
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- supabase && git diff --cached --quiet -- supabase; then
            echo "Canonical layout already committed; verification-only run."
            exit 0
          fi

          git config user.name "arena-agent"
          git config user.email "arena-agent@users.noreply.github.com"
          git add -A supabase
          git commit -m "refactor(db): replace historical bootstrap with proven canonical baseline"
          git push origin HEAD:agent/canonical-db-baseline-takeover
