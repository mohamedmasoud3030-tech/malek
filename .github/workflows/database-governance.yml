name: Database Governance

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'scripts/check-database-governance.mjs'
      - 'DATABASE_RULES.md'
      - '.github/workflows/database-governance.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'scripts/check-database-governance.mjs'
      - 'DATABASE_RULES.md'

permissions:
  contents: write

jobs:
  database-governance:
    name: database-governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Enforce canonical migration rules
        run: node scripts/check-database-governance.mjs

  finalize-operations-compatibility:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'integration/final-consolidation-20260828'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: integration/final-consolidation-20260828
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Replace stale OPERATIONS matrix expectation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/supabase-tests/rls-matrix.mjs')
          s = p.read_text()
          start = s.index('  // OPERATIONS may still appear in the SQL catalog for properties.write,')
          end = s.index("\n  await expectMutationDenied(\n    db,\n    ids.adminA,\n    `with u as (\n       update public.expenses", start)
          new = "  // P51 compatibility contract: historical broad role defaults remain fallback\n  // until the office owner records an explicit granular decision.\n  await expectMutationAllowed(\n    db,\n    ids.operationsA,\n    `with u as (\n       insert into public.properties (title, type, address, status, company_id)\n       values ('Operations compatibility write', 'residential', 'A', 'active', '${COMPANY_A}')\n       returning id\n     ) select count(*)::int as n from u`,\n    { id: 'rls.operationsA.insert.properties.compat', group: 'rls-write', title: 'OPERATIONS keeps historical properties.write compatibility fallback' },\n  );\n  await expectHelper(db, ids.operationsA, `select public.current_user_has_effective_app_permission('contracts.create') as v`, true,\n    { id: 'auth.operationsA.contracts_create.compat', group: 'auth', title: 'OPERATIONS keeps historical contracts.write compatibility fallback' });\n  await db.exec(`\n    insert into public.user_permission_overrides(company_id,user_id,permission,allowed,set_by,reason,set_at)\n    values\n      ('${COMPANY_A}','${OPERATIONS_A}','properties.create',false,'${ADMIN_A}','matrix explicit granular deny',now()),\n      ('${COMPANY_A}','${OPERATIONS_A}','contracts.create',false,'${ADMIN_A}','matrix explicit granular deny',now())\n    on conflict(company_id,user_id,permission) do update set allowed=excluded.allowed,set_by=excluded.set_by,reason=excluded.reason,set_at=excluded.set_at\n  `);\n  await expectMutationDenied(\n    db,\n    ids.operationsA,\n    `with u as (\n       insert into public.properties (title, type, address, status, company_id)\n       values ('Operations explicitly denied', 'residential', 'A', 'active', '${COMPANY_A}')\n       returning id\n     ) select count(*)::int as n from u`,\n    { id: 'rls.operationsA.insert.properties.override', group: 'rls-write', title: 'explicit properties.create=false overrides OPERATIONS compatibility fallback' },\n  );\n  await expectHelper(db, ids.operationsA, `select public.current_user_has_effective_app_permission('contracts.create') as v`, false,\n    { id: 'auth.operationsA.contracts_create.override', group: 'auth', title: 'explicit contracts.create=false overrides OPERATIONS compatibility fallback' });\n"
          p.write_text(s[:start] + new + s[end:])
          PY
      - name: Validate corrected boundary
        run: |
          pnpm test:supabase:rls
          pnpm db0:gate
          pnpm --dir rentrix-app typecheck
          git diff --check
      - name: Commit correction and restore canonical workflow
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/database-governance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/supabase-tests/rls-matrix.mjs .github/workflows/database-governance.yml
          git commit -m "test(auth): prove operations fallback override precedence"
          git push origin HEAD:integration/final-consolidation-20260828
