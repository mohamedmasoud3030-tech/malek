name: Database Governance

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'scripts/check-database-governance.mjs'
      - 'DATABASE_RULES.md'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'scripts/check-database-governance.mjs'
      - 'DATABASE_RULES.md'

permissions:
  contents: read

jobs:
  database-governance:
    name: database-governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Enforce canonical migration rules
        run: node scripts/check-database-governance.mjs
