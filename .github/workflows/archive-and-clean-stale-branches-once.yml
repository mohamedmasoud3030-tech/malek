name: One-time archive and clean stale branches

on:
  push:
    paths:
      - '.github/workflows/archive-and-clean-stale-branches-once.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  archive-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Archive all non-active branch histories, then delete stale branch refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

          default_branch="${{ github.event.repository.default_branch }}"
          archive_tag="archive/pre-stabilization-20260902"

          declare -A keep
          keep["$default_branch"]=1
          keep["arena/01a061cb-malek"]=1

          while IFS= read -r head; do
            [ -n "$head" ] && keep["$head"]=1
          done < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" --jq '.[] | select(.head.repo.full_name == env.GITHUB_REPOSITORY) | .head.ref')

          mapfile -t branches < <(
            git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin \
              | grep -v '^HEAD$' \
              | sort
          )

          candidates=()
          tips=()
          preserved=()

          for branch in "${branches[@]}"; do
            if [[ -n "${keep[$branch]:-}" ]]; then
              preserved+=("$branch")
              continue
            fi
            sha=$(git rev-parse "refs/remotes/origin/$branch")
            candidates+=("$branch")
            tips+=("$sha")
          done

          main_sha=$(git rev-parse "refs/remotes/origin/$default_branch")
          tree_sha=$(git rev-parse "${main_sha}^{tree}")

          parents=(-p "$main_sha")
          for sha in "${tips[@]}"; do
            parents+=(-p "$sha")
          done

          archive_commit=$(printf '%s\n' \
            'Archive stale branch histories before repository cleanup.' \
            '' \
            'This synthetic commit intentionally keeps the main tree unchanged while retaining every archived branch tip as a parent.' \
            | git commit-tree "$tree_sha" "${parents[@]}")

          git push origin "$archive_commit:refs/tags/$archive_tag"

          deleted=()
          moved=()
          failed=()

          for i in "${!candidates[@]}"; do
            branch="${candidates[$i]}"
            archived_sha="${tips[$i]}"
            current_sha=$(git ls-remote origin "refs/heads/$branch" | awk '{print $1}')

            if [[ -z "$current_sha" ]]; then
              continue
            fi

            if [[ "$current_sha" != "$archived_sha" ]]; then
              moved+=("$branch")
              continue
            fi

            if git push origin --delete "$branch"; then
              deleted+=("$branch")
            else
              failed+=("$branch")
            fi
          done

          echo "ARCHIVE_TAG=$archive_tag"
          echo "ARCHIVE_COMMIT=$archive_commit"
          echo "DELETED_COUNT=${#deleted[@]}"
          echo "PRESERVED_ACTIVE_OR_OPEN_PR_COUNT=${#preserved[@]}"
          echo "MOVED_DURING_RUN_COUNT=${#moved[@]}"
          echo "FAILED_COUNT=${#failed[@]}"
          printf 'DELETED_BRANCHES=%s\n' "$(printf '%s\n' "${deleted[@]}" | jq -R -s -c 'split("\n")[:-1]')"
          printf 'PRESERVED_BRANCHES=%s\n' "$(printf '%s\n' "${preserved[@]}" | jq -R -s -c 'split("\n")[:-1]')"
          printf 'MOVED_BRANCHES=%s\n' "$(printf '%s\n' "${moved[@]}" | jq -R -s -c 'split("\n")[:-1]')"
          printf 'FAILED_BRANCHES=%s\n' "$(printf '%s\n' "${failed[@]}" | jq -R -s -c 'split("\n")[:-1]')"

          {
            echo '## One-time stale branch archive + cleanup'
            echo
            echo "Archive tag: \`$archive_tag\`"
            echo
            echo "Archived branch tips: ${#candidates[@]}"
            echo
            echo "Deleted stale branch refs: ${#deleted[@]}"
            echo
            echo "Preserved active/open-PR branches: ${#preserved[@]}"
            echo
            echo "Branches that moved during cleanup and were therefore preserved: ${#moved[@]}"
            echo
            echo "Failures: ${#failed[@]}"
          } >> "$GITHUB_STEP_SUMMARY"

          if (( ${#failed[@]} > 0 )); then
            exit 1
          fi
