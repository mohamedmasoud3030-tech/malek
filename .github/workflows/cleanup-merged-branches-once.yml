name: One-time safe merged branch cleanup

on:
  push:
    paths:
      - '.github/workflows/cleanup-merged-branches-once.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only branches fully contained in main
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const defaultBranch = context.payload.repository.default_branch || 'main';
            const explicitKeep = new Set([
              defaultBranch,
              'arena/01a061cb-malek',
            ]);

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            const openPrHeads = new Set(
              pulls
                .filter(pr => pr.head?.repo?.full_name === `${owner}/${repo}`)
                .map(pr => pr.head.ref)
            );

            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner,
              repo,
              per_page: 100,
            });

            const deleted = [];
            const preserved = [];
            const failed = [];

            for (const branch of branches) {
              const name = branch.name;

              if (explicitKeep.has(name)) {
                preserved.push(`${name} [explicit keep]`);
                continue;
              }

              if (openPrHeads.has(name)) {
                preserved.push(`${name} [open PR]`);
                continue;
              }

              try {
                const comparison = await github.rest.repos.compareCommits({
                  owner,
                  repo,
                  base: defaultBranch,
                  head: name,
                });

                if (comparison.data.ahead_by !== 0) {
                  preserved.push(`${name} [${comparison.data.ahead_by} commit(s) ahead]`);
                  continue;
                }

                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${name}`,
                });
                deleted.push(name);
              } catch (error) {
                failed.push(`${name}: ${error.status || ''} ${error.message}`.trim());
              }
            }

            core.info(`DELETED_COUNT=${deleted.length}`);
            core.info(`PRESERVED_COUNT=${preserved.length}`);
            core.info(`FAILED_COUNT=${failed.length}`);
            core.info(`DELETED_BRANCHES=${JSON.stringify(deleted)}`);
            core.info(`PRESERVED_BRANCHES=${JSON.stringify(preserved)}`);
            core.info(`FAILED_BRANCHES=${JSON.stringify(failed)}`);

            await core.summary
              .addHeading('One-time safe branch cleanup')
              .addRaw(`Deleted: ${deleted.length}\n\n`)
              .addRaw(`Preserved: ${preserved.length}\n\n`)
              .addRaw(`Failed: ${failed.length}\n\n`)
              .addHeading('Deleted branches', 2)
              .addCodeBlock(deleted.join('\n') || '(none)')
              .addHeading('Failures', 2)
              .addCodeBlock(failed.join('\n') || '(none)')
              .write();
