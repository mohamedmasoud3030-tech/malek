name: P2 RPC V2 Repair

on:
  push:
    branches:
      - recovery/p2-final-20260828

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: recovery/p2-final-20260828
          fetch-depth: 0
      - name: Preserve canonical RPCs and add explicit v2 commands
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess, re

          migration = Path('supabase/migrations/20260901000037_short_stay_lease_mode.sql')
          text = migration.read_text()

          create_drop = '''DROP FUNCTION IF EXISTS public.create_contract_atomic(
            text, uuid, uuid, uuid, date, date, numeric, text, uuid, text, text, text, text, integer, integer
          );
          '''
          update_drop = '''DROP FUNCTION IF EXISTS public.update_contract_atomic(
            text, text, uuid, uuid, uuid, date, date, numeric, text, uuid, text, text, text, text
          );
          '''
          text = text.replace(create_drop, '')
          text = text.replace(update_drop, '')
          text = text.replace('CREATE OR REPLACE FUNCTION "public"."create_contract_atomic"(', 'CREATE OR REPLACE FUNCTION "public"."create_contract_atomic_v2"(')
          text = text.replace('CREATE OR REPLACE FUNCTION "public"."update_contract_atomic"(', 'CREATE OR REPLACE FUNCTION "public"."update_contract_atomic_v2"(')
          text = text.replace('public.create_contract_atomic(\n  text, uuid, uuid, uuid, date, date, numeric, text, uuid, text, text, text, text, integer, integer, text, numeric\n)', 'public.create_contract_atomic_v2(\n  text, uuid, uuid, uuid, date, date, numeric, text, uuid, text, text, text, text, integer, integer, text, numeric\n)')
          text = text.replace('public.update_contract_atomic(\n  text, text, uuid, uuid, uuid, date, date, numeric, text, uuid, text, text, text, text, text, numeric\n)', 'public.update_contract_atomic_v2(\n  text, text, uuid, uuid, uuid, date, date, numeric, text, uuid, text, text, text, text, text, numeric\n)')
          text = text.replace('The old signature is dropped explicitly so the catalog keeps exactly one\n-- function instead of an ambiguous overload pair.', 'The canonical legacy signature remains intact. Short Stay uses an explicit\n-- v2 command so PostgREST never has an overloaded-RPC ambiguity.')
          migration.write_text(text)

          replacements = {
            Path('rentrix-app/src/features/contracts/services/contractService.ts'): [
              ("supabase.rpc('create_contract_atomic',", "supabase.rpc('create_contract_atomic_v2',"),
              ("supabase.rpc('update_contract_atomic',", "supabase.rpc('update_contract_atomic_v2',"),
            ],
            Path('rentrix-app/src/features/contracts/services/contractService.test.ts'): [
              ('create_contract_atomic', 'create_contract_atomic_v2'),
              ('update_contract_atomic', 'update_contract_atomic_v2'),
            ],
            Path('rentrix-app/src/features/contracts/short-stay-lease-mode.pglite.test.ts'): [
              ('create_contract_atomic', 'create_contract_atomic_v2'),
              ('update_contract_atomic', 'update_contract_atomic_v2'),
            ],
            Path('rentrix-app/src/features/lifecycle/p2-owner-reconciliation-journey.pglite.test.ts'): [
              ('create_contract_atomic', 'create_contract_atomic_v2'),
              ('update_contract_atomic', 'update_contract_atomic_v2'),
            ],
          }
          for path, reps in replacements.items():
            s = path.read_text()
            for old, new in reps:
              s = s.replace(old, new)
            path.write_text(s)

          db_path = Path('rentrix-app/src/types/database.ts')
          branch_db = db_path.read_text()
          main_db = subprocess.check_output(['git','show','origin/main:rentrix-app/src/types/database.ts'], text=True)

          def extract_block(source, name):
            lines = source.splitlines(keepends=True)
            start = next(i for i,l in enumerate(lines) if l.startswith(f'      {name}: {{'))
            end = len(lines)
            for j in range(start + 1, len(lines)):
              if re.match(r'^      [A-Za-z0-9_]+: \{$', lines[j]):
                end = j
                break
            return ''.join(lines[start:end])

          old_create = extract_block(main_db, 'create_contract_atomic')
          old_update = extract_block(main_db, 'update_contract_atomic')
          branch_db = branch_db.replace('      create_contract_atomic: {', '      create_contract_atomic_v2: {', 1)
          branch_db = branch_db.replace('      update_contract_atomic: {', '      update_contract_atomic_v2: {', 1)
          branch_db = branch_db.replace('      create_contract_atomic_v2: {', old_create + '      create_contract_atomic_v2: {', 1)
          branch_db = branch_db.replace('      update_contract_atomic_v2: {', old_update + '      update_contract_atomic_v2: {', 1)
          db_path.write_text(branch_db)
          PY

          rm -f .github/workflows/p2-rpc-v2-repair.yml
          git add -A
          changed="$(git diff --cached --name-only | sort)"
          allowed="$(printf '%s\n' \
            .github/workflows/p2-rpc-v2-repair.yml \
            rentrix-app/src/features/contracts/services/contractService.test.ts \
            rentrix-app/src/features/contracts/services/contractService.ts \
            rentrix-app/src/features/contracts/short-stay-lease-mode.pglite.test.ts \
            rentrix-app/src/features/lifecycle/p2-owner-reconciliation-journey.pglite.test.ts \
            rentrix-app/src/types/database.ts \
            supabase/migrations/20260901000037_short_stay_lease_mode.sql | sort)"
          unexpected="$(comm -23 <(printf '%s\n' "$changed") <(printf '%s\n' "$allowed"))"
          if [ -n "$unexpected" ]; then
            echo "Unexpected repair diff:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          git config user.name 'MALEK Release Bot'
          git config user.email '250202280+mohamedmasoud3030-tech@users.noreply.github.com'
          git commit -m 'fix(p2): preserve canonical contract RPCs with v2 commands'
          git push origin HEAD:recovery/p2-final-20260828
