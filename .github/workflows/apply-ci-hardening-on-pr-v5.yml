name: Apply CI hardening non-workflow patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-patch:
    if: ${{ github.event.pull_request.head.ref == 'fix/ci-hardening-sonar-supabase-diagnostics' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Decode and apply exact uploaded patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, pathlib, re
          workflow = pathlib.Path('.github/workflows/apply-ci-hardening-patch.yml').read_text()
          match = re.search(r'^\s*PATCH_GZIP_B64:\s*(\S+)\s*$', workflow, re.MULTILINE)
          if not match:
              raise SystemExit('embedded patch payload not found')
          pathlib.Path('/tmp/ci-hardening.patch').write_bytes(gzip.decompress(base64.b64decode(match.group(1))))
          PY
          test "$(sha256sum /tmp/ci-hardening.patch | cut -d' ' -f1)" = "8f47590ff7420253a5e0cffc1e136ff2b50c6f8d02bf45e16c3d1cff3a5f1c1c"
          git apply --check /tmp/ci-hardening.patch
          git apply /tmp/ci-hardening.patch
          git checkout HEAD -- .github/workflows/browser-readiness.yml .github/workflows/ci.yml .github/workflows/release-blocker-gate.yml
      - name: Commit non-workflow changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/NEXT.md evidence/preflight rentrix-app/src/services/documents/DocumentRenderer.ts scripts/collect-supabase-migration-evidence.sh sonar-project.properties
          git commit -m "fix(ci): harden diagnostics and Sonar scope"
      - name: Push non-workflow changes
        run: git push origin HEAD:${{ github.event.pull_request.head.ref }}
