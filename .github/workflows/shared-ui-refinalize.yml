name: Rebuild Clean Shared UI PR Branch

on:
  push:
    branches:
      - refactor/shared-ui-cleanup

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/shared-ui-cleanup
          fetch-depth: 0
      - name: Rebuild one-commit final branch
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=$(git rev-parse HEAD)
          git fetch origin main refactor/shared-ui-cleanup-final
          git checkout -B refactor/shared-ui-cleanup-final origin/main
          git checkout "$SOURCE" -- \
            rentrix-app/src/components/ui/canonical-search-filter-usage.test.ts \
            rentrix-app/src/features/automation/components/automation-center-view.tsx \
            rentrix-app/src/features/commissions/components/commissions-view.tsx \
            rentrix-app/src/features/communication/components/communication-hub-view.tsx \
            rentrix-app/src/features/documents-vault/components/documents-vault-workspace.tsx \
            rentrix-app/src/features/financials/receipts/receipts-page.tsx \
            rentrix-app/src/features/financials/reconciliation/bank-reconciliation-page.tsx \
            rentrix-app/src/features/lands/components/lands-view.tsx \
            rentrix-app/src/features/leads/components/leads-view.tsx \
            rentrix-app/src/features/people/people-list-page.tsx \
            rentrix-app/src/features/service-providers/service-providers-page.tsx \
            rentrix-app/src/features/utilities/components/utilities-workspace.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rentrix-app/src
          git diff --cached --check
          git commit -m "refactor(ui): consolidate shared register ownership"
          git push --force origin HEAD:refactor/shared-ui-cleanup-final
      - name: Remove one-shot workflow
        if: always()
        run: |
          git checkout refactor/shared-ui-cleanup
          rm -f .github/workflows/shared-ui-refinalize.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(ui): remove refinalization workflow"
            git push origin HEAD:refactor/shared-ui-cleanup
          fi
