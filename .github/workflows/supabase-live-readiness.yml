name: Supabase Live Readiness / Read-only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_READONLY_DB_URL }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run read-only live readiness checks
        run: bash scripts/verify-supabase-live-readiness.sh
