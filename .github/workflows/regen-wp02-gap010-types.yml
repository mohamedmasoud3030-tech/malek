name: Temporary GAP-010 type regeneration

on:
  push:
    branches:
      - feat/wp02-gap010-tax-authority
    paths:
      - .github/workflows/regen-wp02-gap010-types.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/wp02-gap010-tax-authority
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm rebuild esbuild
      - name: Regenerate database types from the full migration chain
        run: pnpm db0:gen-types
      - name: Commit generated types
        run: |
          git add rentrix-app/src/types/database.ts
          if git diff --cached --quiet; then
            echo "Generated types already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate database types for GAP-010"
          git push origin HEAD:feat/wp02-gap010-tax-authority
