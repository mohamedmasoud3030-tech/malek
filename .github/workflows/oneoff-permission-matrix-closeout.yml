name: One-off permission matrix closeout

on:
  push:
    branches:
      - integration/final-consolidation-20260828
    paths:
      - '.github/workflows/oneoff-permission-matrix-closeout.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: integration/final-consolidation-20260828
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Apply permission-boundary closeout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          migration = Path('supabase/migrations/20260901000055_permission_boundary_matrix_alignment.sql')
          if migration.exists():
              raise SystemExit('migration 55 already exists')
          migration.write_text("""-- Permission-boundary closeout for server-only tables.
-- Direct browser access remains denied; SECURITY DEFINER commands stay the only
-- mutation/read path for these internal credential/override stores.

begin;

revoke all on table public.owner_portal_links from public, anon, authenticated;
revoke all on table public.tenant_portal_links from public, anon, authenticated;
revoke all on table public.user_permission_overrides from public, anon, authenticated;

create policy owner_portal_links_direct_client_deny
  on public.owner_portal_links as restrictive for all to anon, authenticated
  using (false) with check (false);

create policy tenant_portal_links_direct_client_deny
  on public.tenant_portal_links as restrictive for all to anon, authenticated
  using (false) with check (false);

create policy user_permission_overrides_direct_client_deny
  on public.user_permission_overrides as restrictive for all to anon, authenticated
  using (false) with check (false);

commit;
""")

          path = Path('scripts/supabase-tests/rls-matrix.mjs')
          text = path.read_text()

          anon_pattern = re.compile(
              r"  const anonDefiner = \(await db\.query\(`.*?\n  const hookGrants = \(await db\.query\(`",
              re.S,
          )
          anon_replacement = """  const anonDefiners = (await db.query(`
    select p.proname as name, oidvectortypes(p.proargtypes) as args
      from pg_proc p
      join pg_namespace n on n.oid = p.pronamespace
     where n.nspname = 'public'
       and p.prosecdef
       and has_function_privilege('anon', p.oid, 'EXECUTE')
     order by p.proname, oidvectortypes(p.proargtypes)
  `)).rows.map((row) => `${row.name}(${row.args})`).sort();
  const allowedAnonDefiners = [
    'get_owner_portal_snapshot(uuid)',
    'get_tenant_portal_snapshot(uuid)',
  ].sort();
  const anonDefinersMatch = JSON.stringify(anonDefiners) === JSON.stringify(allowedAnonDefiners);
  record({
    id: 'struct.anon_definer_allowlist',
    group: 'structural',
    title: 'only audited bearer-token portal snapshots are executable by anon',
    status: anonDefinersMatch ? 'pass' : 'fail',
    detail: anonDefinersMatch ? undefined : `anon definers: ${anonDefiners.join(', ') || 'none'}`,
  });

  const hookGrants = (await db.query(`"""
          text, count = anon_pattern.subn(anon_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'anon definer block replacement count={count}')

          operations_pattern = re.compile(
              r"  // OPERATIONS may still appear in the SQL catalog for properties\.write,.*?\n  await expectMutationDenied\(\n    db,\n    ids\.adminA,",
              re.S,
          )
          operations_replacement = """  // Granular P6 intentionally keeps historical broad role defaults as a
  // compatibility fallback until the Office Owner writes an explicit action
  // decision. Prove both halves: fallback remains compatible, explicit granular
  // DENY immediately becomes authoritative.
  const operationsCompatibilityWrite = await queryAs(
    db,
    ids.operationsA,
    `with u as (
       insert into public.properties (title, type, address, status, company_id)
       values ('Operations compatibility write', 'residential', 'A', 'active', '${COMPANY_A}')
       returning id
     ) select count(*)::int as n from u`,
  );
  record({
    id: 'rls.operationsA.compat.properties_create',
    group: 'rls-write',
    title: 'OPERATIONS keeps the historical properties.write fallback until an owner decision exists',
    status: operationsCompatibilityWrite.ok && Number(operationsCompatibilityWrite.value?.[0]?.n ?? 0) === 1 ? 'pass' : 'fail',
    detail: operationsCompatibilityWrite.ok ? undefined : firstLine(operationsCompatibilityWrite.error),
  });

  await db.exec(`
    insert into public.user_permission_overrides
      (company_id, user_id, permission, allowed, set_by, reason, set_at)
    values
      ('${COMPANY_A}', '${OPERATIONS_A}', 'properties.create', false, '${ADMIN_A}', 'RLS_MATRIX_OWNER_DENY', now())
    on conflict (company_id, user_id, permission) do update
      set allowed = excluded.allowed, set_by = excluded.set_by,
          reason = excluded.reason, set_at = excluded.set_at;
  `);

  const operationsDeniedAfterOwnerDecision = await queryAs(
    db,
    ids.operationsA,
    `with u as (
       insert into public.properties (title, type, address, status, company_id)
       values ('Operations denied write', 'residential', 'A', 'active', '${COMPANY_A}')
       returning id
     ) select count(*)::int as n from u`,
  );
  record({
    id: 'rls.operationsA.owner_deny.properties_create',
    group: 'rls-write',
    title: 'Office Owner granular DENY overrides the OPERATIONS compatibility parent',
    status: !operationsDeniedAfterOwnerDecision.ok || Number(operationsDeniedAfterOwnerDecision.value?.[0]?.n ?? 0) === 0 ? 'pass' : 'fail',
    detail: operationsDeniedAfterOwnerDecision.ok
      ? 'OPERATIONS inserted despite explicit properties.create DENY'
      : (isDenied(operationsDeniedAfterOwnerDecision.error) ? undefined : firstLine(operationsDeniedAfterOwnerDecision.error)),
  });

  await db.exec(`
    delete from public.user_permission_overrides
     where company_id = '${COMPANY_A}'
       and user_id = '${OPERATIONS_A}'
       and permission = 'properties.create';
  `);

  await expectMutationDenied(
    db,
    ids.adminA,"""
          text, count = operations_pattern.subn(operations_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'OPERATIONS block replacement count={count}')

          path.write_text(text)
          PY

      - name: Run full RLS matrix
        run: pnpm test:supabase:rls

      - name: Run focused authorization regression tests
        run: pnpm --filter ./rentrix-app exec vitest run src/features/auth/permissions.test.ts src/features/auth/effective-permissions-admin.test.ts src/features/auth/granular-employee-permissions.test.ts src/features/auth/granular-write-boundary-alignment.test.ts

      - name: Typecheck
        run: pnpm typecheck

      - name: Commit closeout and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/oneoff-permission-matrix-closeout.yml
          git add supabase/migrations/20260901000055_permission_boundary_matrix_alignment.sql \
                  scripts/supabase-tests/rls-matrix.mjs \
                  .github/workflows/oneoff-permission-matrix-closeout.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(auth): close permission boundary matrix'
          git push origin HEAD:integration/final-consolidation-20260828
