name: TEMP P3 Utility Type Fix

on:
  push:
    branches:
      - fix/p3-utilities-maintenance-lifecycle-20260828

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'chore(p3): run utility type repair'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/p3-utilities-maintenance-lifecycle-20260828
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm rebuild esbuild
      - name: Repair utility frontend contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          service = Path('rentrix-app/src/features/utilities/utilities-service.ts')
          text = service.read_text()
          wrong = "  responsible_party: ResponsibleParty;\n  actual_payer?: ResponsibleParty | null;\n  is_active: boolean;"
          right_meter = "  responsible_party: ResponsibleParty;\n  is_active: boolean;"
          if wrong not in text:
              raise SystemExit('expected accidental meter actual_payer field not found')
          text = text.replace(wrong, right_meter, 1)
          bill_anchor = "  status: UtilityBillStatus;\n  responsible_party: ResponsibleParty;\n  attachment_url?: string | null;"
          bill_replacement = "  status: UtilityBillStatus;\n  responsible_party: ResponsibleParty;\n  actual_payer?: ResponsibleParty | null;\n  attachment_url?: string | null;"
          if bill_anchor not in text:
              raise SystemExit('UtilityBill actual_payer anchor not found')
          text = text.replace(bill_anchor, bill_replacement, 1)
          service.write_text(text)

          workspace = Path('rentrix-app/src/features/utilities/components/utilities-workspace.tsx')
          text = workspace.read_text()
          meter_wrong = "  responsible_party: 'tenant',\n  actual_payer: null,\n  is_active: true,"
          meter_right = "  responsible_party: 'tenant',\n  is_active: true,"
          if meter_wrong not in text:
              raise SystemExit('emptyMeterForm accidental actual_payer not found')
          text = text.replace(meter_wrong, meter_right, 1)
          bill_anchor = "  due_date: getTodayLocalDateString(),\n  responsible_party: 'tenant',\n  billing_period_start: null,"
          bill_replacement = "  due_date: getTodayLocalDateString(),\n  responsible_party: 'tenant',\n  actual_payer: null,\n  billing_period_start: null,"
          if bill_anchor not in text:
              raise SystemExit('emptyBillForm actual_payer anchor not found')
          text = text.replace(bill_anchor, bill_replacement, 1)
          workspace.write_text(text)
          PY
      - name: Verify TypeScript
        run: pnpm typecheck
      - name: Commit repair and remove this workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temp-p3-utility-type-fix.yml
          git add rentrix-app/src/features/utilities/utilities-service.ts rentrix-app/src/features/utilities/components/utilities-workspace.tsx
          git commit -m "fix(p3): align utility actual-payer frontend contracts"
          git push origin HEAD:fix/p3-utilities-maintenance-lifecycle-20260828
