name: Open Shared UI Cleanup PR

on:
  push:
    branches:
      - refactor/shared-ui-cleanup

permissions:
  contents: write
  pull-requests: write

jobs:
  open:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/shared-ui-cleanup
      - name: Open PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr list --repo "${GITHUB_REPOSITORY}" --head refactor/shared-ui-cleanup-final --base main --state open --json number --jq 'length' | grep -q '^0$'; then
            gh pr create \
              --repo "${GITHUB_REPOSITORY}" \
              --base main \
              --head refactor/shared-ui-cleanup-final \
              --title "refactor(ui): consolidate shared register ownership" \
              --body $'## Scope\n- centralize active-filter rendering through FilterBar/ListPage\n- consolidate proven multi-button register row clusters through ActionMenu\n- consolidate Utilities print/PDF presentation through ExportMenu\n- remove redundant feature-owned filter layout wrappers\n- add a regression guard against duplicate active-filter ownership\n\n## Validation\n- targeted UI architecture/register suite: 4 files, 16/16 tests passed\n- check:architecture passed\n- baseline-aware typecheck passed: no new TypeScript errors in this change; the existing untouched accounting/wp05Services.ts legacy cash-flow RPC typing error remains outside scope\n\nNo accounting/business logic, Supabase, schema, migrations, RLS, RPCs, auth, permissions, generated DB types, query/data semantics, or financial document logic changed.'
          fi
      - name: Remove one-shot workflow
        if: always()
        run: |
          rm -f .github/workflows/shared-ui-pr-create-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(ui): remove PR creation workflow"
            git push origin HEAD:refactor/shared-ui-cleanup
          fi
