name: Deep UI State Surface Inspection
on:
  push:
    branches: [audit/deep-ui-inventory-0830]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/shared-ui-deep-clean-work
      - name: Show state wrapper call sites
        shell: bash
        run: |
          echo '=== DataErrorScreen ==='
          rg -n -C 3 --glob 'rentrix-app/src/**/*.{ts,tsx}' 'DataErrorScreen' || true
          echo '=== PageStateCard / WriteErrorCard ==='
          rg -n -C 3 --glob 'rentrix-app/src/**/*.{ts,tsx}' 'PageStateCard|WriteErrorCard' || true
