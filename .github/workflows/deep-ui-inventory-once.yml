name: Deep UI Inventory Once
on:
  push:
    branches: [audit/deep-ui-inventory-0830]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Candidate symbol references
        shell: bash
        run: |
          cd rentrix-app
          echo '=== DEAD/BARREL CANDIDATE SYMBOL REFERENCES (production only) ==='
          for s in LoadingScreen NextStepActions OperationalSummary DatePicker Dropdown FilePickerField IconButton MobileCard StatCard ListItemCard Spinner TextField TextAreaField PasswordField FieldShell Typography ViewModeToggle WorkspaceNav WorkspaceNavItem; do
            echo "--- $s ---"
            rg -n --glob 'src/**/*.{ts,tsx}' --glob '!src/**/*.test.*' --glob '!src/**/*.spec.*' --glob '!src/**/*e2e-fixture*' --glob '!src/components/ui/index.ts' "\\b${s}\\b" src || true
          done
          echo '=== REPORT COMPATIBILITY PATH REFERENCES ==='
          rg -n --glob 'src/**/*.{ts,tsx}' "components/ReportDirectory|components/ReportsWorkspace|report-section-primitives" src || true
          echo '=== CANDIDATE FILE IMPORT PATH REFERENCES ==='
          for p in loading-screen next-step-actions operational-summary date-picker dropdown file-picker-field icon-button mobile-card spinner text-field typography view-mode-toggle workspace-nav; do
            echo "--- $p ---"
            rg -n --glob 'src/**/*.{ts,tsx}' --glob '!src/**/*.test.*' --glob '!src/**/*.spec.*' --glob '!src/**/*e2e-fixture*' "$p" src || true
          done
