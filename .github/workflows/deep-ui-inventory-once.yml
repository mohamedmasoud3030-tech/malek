name: Deep UI State Surface Inspection
on:
  push:
    branches: [audit/deep-ui-inventory-0830]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/shared-ui-deep-clean-work
      - name: Show state wrapper call sites
        shell: bash
        run: |
          echo '=== DataErrorScreen ==='
          grep -R -n -C 3 --include='*.ts' --include='*.tsx' 'DataErrorScreen' rentrix-app/src || true
          echo '=== PageStateCard / WriteErrorCard ==='
          grep -R -n -C 3 -E --include='*.ts' --include='*.tsx' 'PageStateCard|WriteErrorCard' rentrix-app/src || true
