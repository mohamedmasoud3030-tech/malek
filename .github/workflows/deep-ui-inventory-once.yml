name: Deep UI Fixpoint Inventory
on:
  push:
    branches: [audit/deep-ui-inventory-0830]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/shared-ui-deep-clean-work
      - name: Recompute production import graph
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          from collections import defaultdict

          root = Path('rentrix-app/src').resolve()
          exts = ('.ts', '.tsx', '.js', '.jsx')
          files = [p.resolve() for p in root.rglob('*') if p.is_file() and p.suffix in exts]
          file_set = set(files)

          def nonprod(p):
            s=p.as_posix().lower(); n=p.name.lower()
            return any(x in n for x in ('.test.','.spec.','.stories.')) or 'e2e-fixture' in s or '/__tests__/' in s or '/test/' in s

          def resolve(base,spec):
            if spec.startswith('@/'): q=root/spec[2:]
            elif spec.startswith('.'): q=(base.parent/spec).resolve()
            else: return None
            c=[q]
            if q.suffix=='':
              c += [Path(str(q)+e) for e in exts] + [q/('index'+e) for e in exts]
            for x in c:
              try: x=x.resolve()
              except: pass
              if x in file_set: return x
            return None

          inbound=defaultdict(set)
          pat=re.compile(r"(?:from\s+|import\s*\()\s*['\"]([^'\"]+)['\"]")
          for p in files:
            try: text=p.read_text()
            except: continue
            for spec in pat.findall(text):
              t=resolve(p,spec)
              if t and not nonprod(p): inbound[t].add(p)

          def rel(p): return p.relative_to(root).as_posix()
          print('=== ZERO PROD INBOUND SHARED ===')
          for p in sorted(files,key=rel):
            r=rel(p)
            if r.startswith('components/') and not nonprod(p) and p.name not in ('index.ts','index.tsx') and not inbound[p]:
              print(r)

          print('=== ZERO PROD INBOUND FEATURE COMPONENTS ===')
          for p in sorted(files,key=rel):
            r=rel(p)
            if r.startswith('features/') and '/components/' in r and not nonprod(p) and not inbound[p]:
              print(r)

          print('=== BARREL-ONLY SHARED ===')
          for p in sorted(files,key=rel):
            r=rel(p)
            if not r.startswith('components/') or nonprod(p): continue
            prod=inbound[p]
            if prod and all(q.name in ('index.ts','index.tsx') for q in prod):
              print(r)

          print('=== DUPLICATE STEMS ===')
          stems=defaultdict(list)
          for p in files:
            if not nonprod(p): stems[p.stem.lower()].append(p)
          for stem,ps in sorted(stems.items()):
            if len(ps)>=2: print(stem,'::',' | '.join(rel(p) for p in sorted(ps)))
          PY
