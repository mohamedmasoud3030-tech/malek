name: Deep UI Reports Seam Cleanup
on:
  push:
    branches: [audit/deep-ui-inventory-0830]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/shared-ui-deep-clean-work
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate reports consumers to canonical owners
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          src = Path('rentrix-app/src')
          changed = []
          for p in src.rglob('*'):
            if not p.is_file() or p.suffix not in {'.ts', '.tsx'}:
              continue
            s = p.read_text()
            old = s
            s = re.sub(r"from (['\"])(?:\.\./)+report-section-primitives\1", "from '@/components/ui/report-section-primitives'", s)
            s = re.sub(r"from (['\"])\./report-section-primitives\1", "from '@/components/ui/report-section-primitives'", s)
            s = s.replace("@/features/reports/components/ReportDirectory", "@/features/reports/directory/ReportDirectory")
            s = s.replace("@/features/reports/components/ReportsWorkspace", "@/features/reports/workspace/ReportsWorkspace")
            s = s.replace("./components/ReportDirectory", "./directory/ReportDirectory")
            s = s.replace("./components/ReportsWorkspace", "./workspace/ReportsWorkspace")
            s = s.replace("../components/ReportDirectory", "../directory/ReportDirectory")
            s = s.replace("../components/ReportsWorkspace", "../workspace/ReportsWorkspace")
            if p.as_posix().endswith('reports/workspace/reports-workspace-structure.test.ts'):
              s = s.replace("import { readFileSync, readdirSync } from 'node:fs';", "import { existsSync, readFileSync, readdirSync } from 'node:fs';")
              old_block = '''  it('keeps the historical component import paths working through compatibility seams', () => {\n    const workspaceShim = read(resolve(reportsDir, 'components/ReportsWorkspace.tsx'));\n    const directoryShim = read(resolve(reportsDir, 'components/ReportDirectory.tsx'));\n\n    expect(workspaceShim).toContain(\"from '../workspace/ReportsWorkspace'\");\n    expect(directoryShim).toContain(\"from '../directory/ReportDirectory'\");\n  });'''
              new_block = '''  it('uses canonical report owners without compatibility shims', () => {\n    expect(existsSync(resolve(reportsDir, 'workspace/ReportsWorkspace.tsx'))).toBe(true);\n    expect(existsSync(resolve(reportsDir, 'directory/ReportDirectory.tsx'))).toBe(true);\n    expect(existsSync(resolve(reportsDir, 'components/ReportsWorkspace.tsx'))).toBe(false);\n    expect(existsSync(resolve(reportsDir, 'components/ReportDirectory.tsx'))).toBe(false);\n  });'''
              if old_block not in s:
                raise SystemExit('expected legacy seam contract block not found')
              s = s.replace(old_block, new_block)
            if s != old:
              p.write_text(s)
              changed.append(str(p))

          seams = [
            src / 'features/reports/components/ReportDirectory.tsx',
            src / 'features/reports/components/ReportsWorkspace.tsx',
            src / 'features/reports/components/report-section-primitives.tsx',
          ]
          for p in seams:
            if not p.exists(): raise SystemExit(f'missing seam: {p}')
            p.unlink()

          offenders = []
          for p in src.rglob('*'):
            if not p.is_file() or p.suffix not in {'.ts', '.tsx'}: continue
            s = p.read_text(errors='ignore')
            for needle in ['./report-section-primitives', '../report-section-primitives']:
              if needle in s: offenders.append(f'{p}: {needle}')
          if offenders:
            raise SystemExit('legacy report primitive paths remain:\n' + '\n'.join(offenders))
          print(f'migrated {len(changed)} consumers')
          PY
      - name: Targeted report structure tests
        run: pnpm --filter @workspace/rentrix exec vitest run --config vite.config.ts src/features/reports/workspace/reports-workspace-structure.test.ts src/features/reports/phase7-reports.test.tsx
      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(reports): remove compatibility presentation seams"
          git push origin HEAD:refactor/shared-ui-deep-clean-work
