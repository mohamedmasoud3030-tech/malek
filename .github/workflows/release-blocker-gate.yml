name: Release Blocker Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-blocker-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SUPABASE_CLI_VERSION: '2.105.0'
  PLAYWRIGHT_VERSION: '1.61.1'

jobs:
  release-blocker-code:
    name: release-blocker-code
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify pinned toolchain
        run: node scripts/ci/verify-tool-versions.mjs
      - name: Validate gate scripts
        run: |
          bash -n scripts/check-release-secret-leaks.sh
          bash -n scripts/ci/start-supabase-stable.sh
          bash -n scripts/ci/run-supabase-database-gate.sh
          node --check scripts/assert-release-blocker-env.mjs
          node --check scripts/ci/preflight-staging.mjs
          node --check scripts/ci/check-cron-quoting.mjs
          node --check rentrix-app/scripts/storage-staging-smoke.mjs
      - name: Typecheck application and tests
        run: |
          pnpm --filter ./rentrix-app run typecheck
          pnpm --filter ./rentrix-app run typecheck:test
      - name: Run application tests
        run: pnpm --filter ./rentrix-app run test
      - name: Run financial safety tests
        run: pnpm --filter ./rentrix-app run test:financials
      - name: Build browser application
        run: pnpm --filter ./rentrix-app run build
      - name: Reject service-role and private-key markers in browser artifacts
        run: bash scripts/check-release-secret-leaks.sh rentrix-app/dist

  release-blocker-database:
    name: release-blocker-database
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify pinned toolchain
        run: node scripts/ci/verify-tool-versions.mjs
      - name: Replay every migration and run database blockers
        shell: bash
        run: bash scripts/ci/run-supabase-database-gate.sh
      - name: Upload database diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-blocker-database-diagnostics
          path: .ci-diagnostics/supabase
          if-no-files-found: ignore

  release-blocker-authenticated-staging:
    name: release-blocker-authenticated-staging
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [release-blocker-code]
    env:
      E2E_ENVIRONMENT_KIND: staging
      E2E_BASE_URL: ${{ secrets.E2E_STAGING_BASE_URL }}
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      VITE_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      PRODUCTION_SUPABASE_PROJECT_REF: nnggcnpcuomwfuupupwg
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify pinned toolchain
        run: node scripts/ci/verify-tool-versions.mjs
      - name: Fail closed when staging credentials are unavailable
        run: node scripts/assert-release-blocker-env.mjs
      - name: Verify staging application and Auth endpoints
        run: node scripts/ci/preflight-staging.mjs
      - name: Verify private Storage upload, signed download, denial, and cleanup
        shell: bash
        run: |
          mkdir -p .ci-diagnostics/storage
          set -o pipefail
          pnpm --filter ./rentrix-app exec node scripts/storage-staging-smoke.mjs 2>&1 \
            | tee .ci-diagnostics/storage/storage-staging-smoke.log
      - name: Restore Chromium binary cache
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium system dependencies
        run: pnpm --filter ./rentrix-app exec playwright install-deps chromium
      - name: Install Chromium binary on cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter ./rentrix-app exec playwright install chromium
      - name: Verify Chromium installation
        run: pnpm --filter ./rentrix-app exec playwright install --dry-run chromium
      - name: Run real authentication lifecycle tests with zero skips
        run: pnpm --filter ./rentrix-app exec playwright test e2e/release-blocker-auth.spec.ts --config playwright.config.ts --project=chromium-desktop
      - name: Upload failed authentication and Storage diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-blocker-staging-failure
          path: |
            .ci-diagnostics/storage
            rentrix-app/playwright-report
            rentrix-app/test-results
          if-no-files-found: ignore
