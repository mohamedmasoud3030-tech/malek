name: Release Blocker Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-blocker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PLAYWRIGHT_VERSION: '1.61.1'

jobs:
  release-blocker-code:
    name: release-blocker-code
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Defer release gate on pull requests
        if: ${{ github.event_name == 'pull_request' }}
        run: echo "Full release validation is manual during active development."
      - name: Manual release validation
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: echo "Manual release validation continues in the dedicated jobs below."

  release-validation:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm rebuild esbuild
      - name: Typecheck application and tests
        run: |
          pnpm --filter ./rentrix-app run typecheck
          pnpm --filter ./rentrix-app run typecheck:test
      - name: Full application tests
        run: pnpm --filter ./rentrix-app run test
      - name: Financial safety tests
        run: pnpm --filter ./rentrix-app run test:financials
      - name: Build browser application
        run: pnpm --filter ./rentrix-app run build
      - name: Canonical database and lifecycle gate
        run: bash scripts/ci/run-supabase-database-gate.sh

  release-blocker-database:
    name: release-blocker-database
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "Database release gate is manual unless database-sensitive changes are intentionally being released."

  release-blocker-authenticated-staging:
    name: release-blocker-authenticated-staging
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "Authenticated staging validation is manual during active development."
