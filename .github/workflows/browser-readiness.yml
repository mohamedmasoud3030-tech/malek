name: Browser Readiness / E2E Smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PLAYWRIGHT_VERSION: '1.61.1'

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      # Keep install deterministic and block arbitrary package lifecycle scripts.
      # esbuild is the only approved native toolchain package that needs its binary shim rebuilt.
      - name: Install dependencies with lifecycle scripts disabled
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Rebuild approved native toolchain package
        run: pnpm rebuild esbuild
      - name: Verify pinned toolchain
        run: node scripts/ci/verify-tool-versions.mjs
      - name: Restore Chromium binary cache
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium system dependencies
        run: node rentrix-app/node_modules/playwright/cli.js install-deps chromium
      - name: Install Chromium binary on cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: node rentrix-app/node_modules/playwright/cli.js install chromium
      - name: Verify Chromium installation
        run: node rentrix-app/node_modules/playwright/cli.js install --dry-run chromium
      - name: Run complete browser readiness suite
        run: pnpm e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: rentrix-app/playwright-report
          if-no-files-found: ignore
      - name: Upload browser smoke artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-smoke-artifacts
          path: rentrix-app/test-results
          if-no-files-found: ignore

  seeded-staging-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: ${{ github.event_name == 'workflow_dispatch' }}
    env:
      E2E_ENVIRONMENT_KIND: staging
      E2E_BASE_URL: ${{ secrets.E2E_STAGING_BASE_URL }}
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      VITE_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      # Keep install deterministic and block arbitrary package lifecycle scripts.
      # esbuild is the only approved native toolchain package that needs its binary shim rebuilt.
      - name: Install dependencies with lifecycle scripts disabled
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Rebuild approved native toolchain package
        run: pnpm rebuild esbuild
      - name: Verify pinned toolchain
        run: node scripts/ci/verify-tool-versions.mjs
      - name: Validate staging environment
        run: |
          node scripts/assert-release-blocker-env.mjs
          node scripts/ci/preflight-staging.mjs
      - name: Restore Chromium binary cache
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium system dependencies
        run: node rentrix-app/node_modules/playwright/cli.js install-deps chromium
      - name: Install Chromium binary on cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: node rentrix-app/node_modules/playwright/cli.js install chromium
      - name: Verify Chromium installation
        run: node rentrix-app/node_modules/playwright/cli.js install --dry-run chromium
      - name: Run complete seeded staging suite
        run: pnpm e2e
      - name: Upload seeded staging Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: seeded-staging-playwright-report
          path: |
            rentrix-app/playwright-report
            rentrix-app/test-results
          if-no-files-found: ignore
