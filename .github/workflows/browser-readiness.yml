name: Browser Readiness / E2E Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_staging:
        description: Run the separate hosted-staging proof job
        required: false
        default: false
        type: boolean

concurrency:
  group: browser-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PLAYWRIGHT_VERSION: '1.61.1'

jobs:
  browser-smoke:
    name: browser-smoke
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Defer expensive browser matrix
        run: echo "Browser matrix stays deferred on pull requests; main pushes and workflow_dispatch run the full device matrix."

  browser-smoke-shard:
    name: browser-smoke-${{ matrix.project }}
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-desktop, chromium-tablet, chromium-mobile]
    env:
      VITE_SUPABASE_URL: https://e2e.invalid.supabase.local
      VITE_SUPABASE_ANON_KEY: e2e-browser-public-key
      E2E_WORKERS: '2'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Rebuild approved native toolchain package
        run: pnpm rebuild esbuild
      - name: Restore Chromium cache
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium on cache miss
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter ./rentrix-app exec playwright install chromium
      - name: Run browser readiness shard
        run: pnpm e2e --project=${{ matrix.project }}
      - name: Upload Playwright diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-smoke-artifacts-${{ matrix.project }}
          path: |
            rentrix-app/playwright-report
            rentrix-app/test-results
          if-no-files-found: ignore

  seeded-staging-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_staging }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      E2E_ENVIRONMENT_KIND: staging
      E2E_BASE_URL: ${{ secrets.E2E_STAGING_BASE_URL }}
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      VITE_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm rebuild esbuild
      - name: Validate staging environment
        run: |
          node scripts/assert-release-blocker-env.mjs
          node scripts/ci/preflight-staging.mjs
      - name: Run complete seeded staging suite
        run: pnpm e2e
