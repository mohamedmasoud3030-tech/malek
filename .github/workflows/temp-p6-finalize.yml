name: TEMP P6 Finalize And Verify

on:
  push:
    branches:
      - fix/p6-owner-employee-permissions-20260828
    paths:
      - '.github/workflows/temp-p6-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: fix/p6-owner-employee-permissions-20260828
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm rebuild esbuild
      - name: Correct owner portal financial and document projection
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('supabase/migrations/20260901000044_external_portal_read_links.sql')
          text = path.read_text()

          old_payable = "coalesce(sum(case when upper(coalesce(s.status::text, '')) in ('APPROVED','PAID') then s.net_payable else 0 end), 0)"
          new_payable = "coalesce(sum(case when upper(coalesce(s.status::text, '')) in ('DRAFT','APPROVED') then s.net_payable else 0 end), 0)"
          if old_payable not in text:
              raise SystemExit('expected owner payable expression not found')
          text = text.replace(old_payable, new_payable, 1)

          start = text.index('  with owner_property_ids as (')
          end = text.index('\n\n  update public.owner_portal_links', start)
          canonical_documents = '''  with owner_property_ids as (
            select po.property_id
            from public.property_owners po
            join public.properties p on p.id = po.property_id and p.company_id = po.company_id
            where po.company_id = v_company
              and po.owner_id = v_owner_id
              and p.deleted_at is null
              and (po.starts_on is null or po.starts_on <= current_date)
              and (po.ends_on is null or po.ends_on >= current_date)
          )
          select coalesce(jsonb_agg(jsonb_build_object(
            'id', vd.id,
            'title', coalesce(nullif(vd.title, ''), vd.file_name, 'مستند'),
            'mime', vd.mime_type,
            'scope', case
              when lower(coalesce(vd.related_entity_type, '')) = 'owner' then 'owner'
              else 'property'
            end,
            'createdAt', vd.created_at
          ) order by vd.created_at desc nulls last, vd.id desc), '[]'::jsonb)
          into v_documents
          from public.vault_documents vd
          where vd.deleted_at is null
            and (
              (
                lower(coalesce(vd.related_entity_type, '')) = 'owner'
                and vd.related_entity_id::text = v_owner_id::text
              )
              or (
                lower(coalesce(vd.related_entity_type, '')) = 'property'
                and exists (
                  select 1
                  from owner_property_ids opi
                  where opi.property_id::text = vd.related_entity_id::text
                )
              )
            );'''
          text = text[:start] + canonical_documents + text[end:]

          if 'from public.attachments a' in text:
              raise SystemExit('legacy attachment projection remains')
          if 'from public.vault_documents vd' not in text:
              raise SystemExit('canonical vault projection missing')
          if "in ('DRAFT','APPROVED') then s.net_payable" not in text:
              raise SystemExit('outstanding payable semantics missing')
          path.write_text(text)
          PY
      - name: Build canonical database and generate exact types
        run: |
          bash scripts/canonical-db/build-baseline.sh
          pnpm db0:gen-types
      - name: Validate portal and architecture
        run: |
          pnpm --dir rentrix-app test -- src/features/owner-portal/owner-portal-boundary.test.ts src/features/tenant-portal/tenant-portal-boundary.test.ts
          pnpm --dir rentrix-app typecheck
          pnpm --dir rentrix-app check:architecture
      - name: Commit verified P6 finalization and remove temporary helpers
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/migrations/20260901000044_external_portal_read_links.sql rentrix-app/src/types/database.ts rentrix-app/src/features/owner-portal
          git rm -f .github/workflows/temp-p6-finalize.yml .github/workflows/temp-p6-owner-portal-build.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix(portals): finalize canonical owner read model"
          git push origin HEAD:fix/p6-owner-employee-permissions-20260828
