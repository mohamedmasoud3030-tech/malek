name: One-off operations compatibility fix

on:
  push:
    branches:
      - integration/final-consolidation-20260828
    paths:
      - .github/workflows/oneoff-operations-compatibility-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/final-consolidation-20260828
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply compatibility correction
        shell: python
        run: |
          from pathlib import Path

          migration = Path('supabase/migrations/20260901000055_permission_boundary_closeout.sql')
          text = migration.read_text()
          text = text.replace(
              "-- * OPERATIONS historically included properties.write/contracts.write/expenses.write/documents.write\n--   which made RLS allow property/contract creation while frontend denied it.\n--   Remove those broad writes so OPERATIONS matches the frontend's\n--   view-only portfolio/leasing posture and only retains maintenance authority.\n",
              "-- * Preserve the P6/P51 compatibility contract for OPERATIONS: historical\n--   properties.write/contracts.write remain fallback inputs until the office owner\n--   makes an explicit granular decision. Exact granular owner overrides still win.\n"
          )
          text = text.replace(
              "-- Six-role matrix alignment: OPERATIONS must not retain portfolio/leasing\n-- broad writes that frontend denies. MANAGER and OPERATIONS gain explicit\n-- granular action permissions so UI/RPC/RLS match without relying solely on\n-- parent fallback.\n",
              "-- Six-role matrix alignment: keep historical OPERATIONS portfolio/leasing\n-- broad writes as compatibility parents. Granular owner decisions remain the\n-- authoritative way to refine those defaults action by action.\n"
          )
          old = """        'properties.view',
        'contracts.view',
        'maintenance.view','maintenance.create','maintenance.edit','maintenance.approve','maintenance.cancel','maintenance.write',"""
          new = """        'properties.view','properties.write',
        'contracts.view','contracts.write',
        'maintenance.view','maintenance.create','maintenance.edit','maintenance.approve','maintenance.cancel','maintenance.write',"""
          if old not in text:
              raise SystemExit('OPERATIONS role block anchor not found')
          migration.write_text(text.replace(old, new))

          matrix = Path('scripts/supabase-tests/rls-matrix.mjs')
          text = matrix.read_text()
          old = """  // OPERATIONS may still appear in the SQL catalog for properties.write,
  // but the current properties write policy is is_admin_or_manager().
  // Record the live database truth. The frontend now fences the same way.
  const operationsWrite = await queryAs(
    db,
    ids.operationsA,
    `with u as (
       insert into public.properties (title, type, address, status, company_id)
       values ('Operations write', 'residential', 'A', 'active', '${COMPANY_A}')
       returning id
     ) select count(*)::int as n from u`,
  );
  record({
    id: 'rls.operationsA.insert.properties',
    group: 'rls-write',
    title: 'OPERATIONS property insert is enforced by is_admin_or_manager() (DB deny)',
    status: !operationsWrite.ok || Number(operationsWrite.value?.[0]?.n ?? 0) === 0 ? 'pass' : 'fail',
    detail: operationsWrite.ok
      ? 'OPERATIONS unexpectedly inserted a property'
      : undefined,
    note: 'Frontend grants properties.write to OPERATIONS; RLS still requires ADMIN/MANAGER.',
  });
"""
          new = """  // P51 compatibility contract: historical broad role defaults remain fallback
  // until the office owner records an explicit granular decision.
  await expectMutationAllowed(
    db,
    ids.operationsA,
    `with u as (
       insert into public.properties (title, type, address, status, company_id)
       values ('Operations compatibility write', 'residential', 'A', 'active', '${COMPANY_A}')
       returning id
     ) select count(*)::int as n from u`,
    { id: 'rls.operationsA.insert.properties.compat', group: 'rls-write', title: 'OPERATIONS keeps historical properties.write compatibility fallback' },
  );

  await expectHelper(
    db,
    ids.operationsA,
    `select public.current_user_has_effective_app_permission('contracts.create') as v`,
    true,
    { id: 'auth.operationsA.contracts_create.compat', group: 'auth', title: 'OPERATIONS keeps historical contracts.write compatibility fallback' },
  );

  await db.exec(`
    insert into public.user_permission_overrides(company_id,user_id,permission,allowed,set_by,reason,set_at)
    values
      ('${COMPANY_A}','${OPERATIONS_A}','properties.create',false,'${ADMIN_A}','matrix explicit granular deny',now()),
      ('${COMPANY_A}','${OPERATIONS_A}','contracts.create',false,'${ADMIN_A}','matrix explicit granular deny',now())
    on conflict(company_id,user_id,permission) do update set
      allowed=excluded.allowed,set_by=excluded.set_by,reason=excluded.reason,set_at=excluded.set_at
  `);

  await expectMutationDenied(
    db,
    ids.operationsA,
    `with u as (
       insert into public.properties (title, type, address, status, company_id)
       values ('Operations explicitly denied', 'residential', 'A', 'active', '${COMPANY_A}')
       returning id
     ) select count(*)::int as n from u`,
    { id: 'rls.operationsA.insert.properties.override', group: 'rls-write', title: 'explicit properties.create=false overrides OPERATIONS compatibility fallback' },
  );

  await expectHelper(
    db,
    ids.operationsA,
    `select public.current_user_has_effective_app_permission('contracts.create') as v`,
    false,
    { id: 'auth.operationsA.contracts_create.override', group: 'auth', title: 'explicit contracts.create=false overrides OPERATIONS compatibility fallback' },
  );
"""
          if old not in text:
              raise SystemExit('RLS matrix OPERATIONS block anchor not found')
          matrix.write_text(text.replace(old, new))
      - name: Validate focused boundaries
        run: |
          pnpm test:supabase:rls
          pnpm db0:gate
          pnpm --dir rentrix-app typecheck
          git diff --check
      - name: Commit and remove one-off workflow
        run: |
          rm .github/workflows/oneoff-operations-compatibility-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260901000055_permission_boundary_closeout.sql scripts/supabase-tests/rls-matrix.mjs .github/workflows/oneoff-operations-compatibility-fix.yml
          git commit -m "fix(auth): preserve operations compatibility fallback"
          git push origin HEAD:integration/final-consolidation-20260828
