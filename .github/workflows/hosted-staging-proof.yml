name: Hosted Staging Proof

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-staging-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hosted-staging-proof:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/rc-closeout-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      E2E_BASE_URL: ${{ secrets.E2E_STAGING_BASE_URL }}
      E2E_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      VITE_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      E2E_FOREIGN_COMPANY_ID: 5138ff36-843b-4556-8057-0130e5a4620b
      PLAYWRIGHT_VERSION: '1.61.1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Install deterministic dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Rebuild approved native package
        run: pnpm rebuild esbuild
      - name: Prove exact deployed RC SHA
        run: node rentrix-app/scripts/hosted-staging-preflight.mjs
      - name: Prove real hosted authentication lifecycle
        env:
          E2E_ENVIRONMENT_KIND: production-readonly
        run: pnpm --filter @workspace/rentrix exec playwright test e2e/release-blocker-auth.spec.ts --project=chromium-desktop
      - name: Prove tenant-scoped Storage upload/download boundary
        run: node rentrix-app/scripts/storage-tenant-isolation-proof.mjs
