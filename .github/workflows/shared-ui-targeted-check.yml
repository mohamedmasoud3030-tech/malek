name: Shared UI Targeted Check

on:
  push:
    branches:
      - refactor/shared-ui-cleanup

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/shared-ui-cleanup
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Targeted architecture tests
        run: >-
          pnpm --filter @workspace/rentrix exec vitest run --config vite.config.ts
          src/components/ui/canonical-search-filter-usage.test.ts
          src/components/ui/canonical-table-usage.test.ts
          src/features/p1-compact-responsive-registers.test.ts
          src/components/ui/entity-table.interaction.test.tsx
      - name: Typecheck
        run: pnpm --filter @workspace/rentrix run typecheck
      - name: Remove one-shot workflow
        if: always()
        run: |
          rm -f .github/workflows/shared-ui-targeted-check.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(ui): remove one-shot validation workflow"
            git push origin HEAD:refactor/shared-ui-cleanup
          fi
