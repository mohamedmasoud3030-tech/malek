name: Canonical Business Rules Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  integrity:
    name: Verify locked business rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify contract, checksum, constitution, and changelog
        run: node scripts/check-canonical-business-rules.mjs

  owner-approval:
    name: Require product-owner approval for protected changes
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_review' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check protected paths and approval on current head
        uses: actions/github-script@v7
        with:
          script: |
            const owner = 'mohamedmasoud3030-tech';
            const pull = context.payload.pull_request;
            if (!pull) {
              core.setFailed('Pull request payload is required.');
              return;
            }

            const protectedPaths = [
              'docs/business/CANONICAL_BUSINESS_AND_CONTRACT_RULES_AR.md',
              'governance/canonical-business-rules.json',
              'governance/canonical-business-rules.sha256',
              'governance/BUSINESS_RULES_CHANGELOG.md',
              'scripts/check-canonical-business-rules.mjs',
              '.github/workflows/canonical-business-rules-guard.yml',
              '.github/CODEOWNERS',
            ];

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pull.number,
              per_page: 100,
            });

            const touched = files
              .map((file) => file.filename)
              .filter((filename) => protectedPaths.includes(filename));

            if (touched.length === 0) {
              core.info('No canonical business-rule paths changed.');
              return;
            }

            if (context.actor === owner) {
              core.info(`Protected paths changed directly by product owner @${owner}.`);
              return;
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pull.number,
              per_page: 100,
            });

            const approvedCurrentHead = reviews.some((review) =>
              review.user?.login === owner &&
              review.state === 'APPROVED' &&
              review.commit_id === pull.head.sha
            );

            if (!approvedCurrentHead) {
              core.setFailed(
                `Protected business-rule paths changed (${touched.join(', ')}). ` +
                `Approval by @${owner} on current head ${pull.head.sha} is required.`
              );
              return;
            }

            core.info(`Current head approved by product owner @${owner}.`);
