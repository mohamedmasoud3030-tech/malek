name: Validate maintenance harvest once

on:
  push:
    branches:
      - fix/harvest-maintenance-1754

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rentrix-app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: rentrix-app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -p tsconfig.json --noEmit
      - run: pnpm vitest run src/features/maintenance/maintenance-helpers.test.ts src/features/maintenance/maintenance-runtime-wiring.contract.test.ts
      - run: pnpm build
