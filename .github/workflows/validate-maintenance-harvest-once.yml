name: Validate maintenance harvest once

on:
  push:
    paths:
      - '.github/workflows/validate-maintenance-harvest-once.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/harvest-maintenance-1754
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Rebuild approved native toolchain package
        run: pnpm rebuild esbuild
      - name: Typecheck
        run: pnpm --filter ./rentrix-app run typecheck
      - name: Focused maintenance tests
        run: pnpm --filter ./rentrix-app exec vitest run src/features/maintenance/maintenance-helpers.test.ts src/features/maintenance/maintenance-runtime-wiring.contract.test.ts
      - name: Build production bundle
        run: pnpm --filter ./rentrix-app run build
