name: CI / Typecheck, Lint & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Governance guard
        run: |
          bash scripts/check-production-mutation-guard.sh
          node scripts/check-manual-migration-workflow.mjs
          node scripts/check-migration-rollback-hygiene.test.mjs
          node scripts/check-no-new-legacy-journal-writes.test.mjs
          git fetch --no-tags origin main
          node scripts/check-migration-rollback-hygiene.mjs --base origin/main
          node scripts/check-no-new-legacy-journal-writes.mjs --base origin/main
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Rebuild approved native toolchain package
        run: pnpm rebuild esbuild
      - name: Enforce feature-flag cleanup deadlines
        run: pnpm check:expired-flags
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Architecture check
        run: pnpm --filter ./rentrix-app run check:architecture
      - name: Frontend–Database contract gate
        run: pnpm --filter ./rentrix-app run check:frontend-db-contract
      - name: Build production bundle
        run: pnpm build

  heavy-validation:
    name: heavy-validation
    if: ${{ github.event_name == 'pull_request' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Rebuild approved native toolchain package
        run: pnpm rebuild esbuild
      - name: Canonical database integrity
        run: pnpm db0:gate
      - name: Documentation links
        run: pnpm check:docs
      - name: Test typecheck
        run: pnpm --filter ./rentrix-app run typecheck:test
      - name: Full application tests
        run: pnpm --filter ./rentrix-app test
      - name: Financial safety tests
        run: pnpm --filter ./rentrix-app run test:financials
