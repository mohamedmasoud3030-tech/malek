name: CI / Typecheck, Lint & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Governance guard
        run: bash scripts/check-production-mutation-guard.sh
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm supabase:migration-evidence
      - name: Check documentation links
        run: pnpm check:docs
      - name: Run typecheck
        id: typecheck
        shell: bash
        run: |
          set +e
          pnpm typecheck > /tmp/rentrix-typecheck.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 200 /tmp/rentrix-typecheck.log
          exit 0
      - name: Upload typecheck diagnostics
        if: steps.typecheck.outputs.status != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rentrix-typecheck-diagnostics
          path: /tmp/rentrix-typecheck.log
      - name: Fail on typecheck errors
        if: steps.typecheck.outputs.status != '0'
        run: exit 1
      - run: pnpm lint
      - name: Run architecture check
        run: pnpm --filter ./rentrix-app run check:architecture
      - run: pnpm build
      - run: pnpm --filter ./rentrix-app run typecheck:test
      - run: pnpm --filter ./rentrix-app test
      - name: Run financial tests
        id: financial-tests
        shell: bash
        run: |
          set +e
          pnpm --filter ./rentrix-app run test:financials > /tmp/rentrix-financial-tests.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 160 /tmp/rentrix-financial-tests.log
          exit 0
      - name: Upload financial test diagnostics
        if: steps.financial-tests.outputs.status != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rentrix-financial-test-diagnostics
          path: /tmp/rentrix-financial-tests.log
      - name: Fail on financial test errors
        if: steps.financial-tests.outputs.status != '0'
        run: exit 1
