name: TEMP P3 Reconcile Once

on:
  push:
    branches:
      - main

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/p3-utilities-maintenance-lifecycle-20260828
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm rebuild esbuild
      - name: Reconcile TypeScript contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('rentrix-app/src/features/maintenance')
          for path in root.rglob('*'):
              if path.suffix not in {'.ts', '.tsx'}:
                  continue
              text = path.read_text()
              text = text.replace("'OFFICE'", "'COMPANY'")
              text = text.replace('"OFFICE"', '"COMPANY"')
              text = text.replace('ResolveMaintenanceResult', 'CloseMaintenanceResult')
              path.write_text(text)
          path = Path('rentrix-app/src/features/utilities/utilities-service.ts')
          text = path.read_text()
          needle = "  responsible_party: ResponsibleParty;\n  attachment_url?: string | null;"
          if 'actual_payer?: ResponsibleParty | null;' not in text:
              if needle not in text:
                  raise SystemExit('utility type anchor not found')
              text = text.replace(needle, "  responsible_party: ResponsibleParty;\n  actual_payer?: ResponsibleParty | null;\n  attachment_url?: string | null;", 1)
              path.write_text(text)
          PY
      - name: Regenerate database contract from canonical schema
        shell: bash
        run: |
          bash scripts/canonical-db/build-baseline.sh
          pnpm db0:gen-types
      - name: Commit repaired branch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rentrix-app/src/features/maintenance rentrix-app/src/features/utilities/utilities-service.ts rentrix-app/src/types/database.ts
          git commit -m "fix(p3): reconcile lifecycle types with canonical schema"
          git push origin HEAD:fix/p3-utilities-maintenance-lifecycle-20260828
      - name: Remove one-shot workflow
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/temp-p3-reconcile-once.yml
          git commit -m "chore: remove one-shot p3 reconciliation"
          git push origin HEAD:main
